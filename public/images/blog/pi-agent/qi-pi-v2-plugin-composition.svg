<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi 2.0 插件组合</title>
  <desc id="desc">Distribution、Loader、Profile 与 Active Context Tree 的关系。</desc>
  <rect width="1400" height="760" fill="#fffdf7"/>
  <text x="50" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="33" font-weight="700"><tspan x="50" dy="0">安装插件包，只是让 Catalog 看见它</tspan></text>
  <text x="52" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="52" dy="0">Profile、Bundle 与 cordis.yml 才决定当前 Context Tree 激活哪些能力。</tspan></text>
  <rect x="55" y="155" width="360" height="490" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="235" y="200" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="235" dy="0">Installed Distributions</tspan></text>
  <rect x="95" y="235" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="260.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">qi-agent-standard</tspan></text>
  <rect x="95" y="292" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="317.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">qi-agent-workflow</tspan></text>
  <rect x="95" y="349" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="374.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">qi-agent-coding</tspan></text>
  <rect x="95" y="406" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="431.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">qi-agent-collaboration</tspan></text>
  <rect x="95" y="463" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="488.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">qi-agent-persona</tspan></text>
  <rect x="95" y="520" width="280" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="235" y="545.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="235" dy="0">providers / products / media</tspan></text>
  <rect x="505" y="155" width="360" height="490" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="685" y="200" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="685" dy="0">Bootstrap / Loader</tspan></text>
  <rect x="555" y="235" width="260" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="685" y="260.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Catalog discovery</tspan></text>
  <rect x="555" y="292" width="260" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="685" y="317.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Profile + Bundle</tspan></text>
  <rect x="555" y="349" width="260" height="42" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="685" y="374.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Context Tree diff</tspan></text>
  <rect x="555" y="406" width="260" height="42" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="685" y="431.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Preflight candidates</tspan></text>
  <rect x="555" y="463" width="260" height="42" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="685" y="488.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Mount + quiescence</tspan></text>
  <rect x="555" y="520" width="260" height="42" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="685" y="545.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="685" dy="0">Postcondition / rollback</tspan></text>
  <rect x="955" y="155" width="390" height="490" rx="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1150" y="200" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="1150" dy="0">Active Context Tree</tspan></text>
  <rect x="1010" y="245" width="280" height="75" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1150" y="277.655" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1150" dy="0">ctx.provide()</tspan><tspan x="1150" dy="21.25">Service Truth</tspan></text>
  <rect x="1010" y="355" width="280" height="75" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1150" y="387.655" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1150" dy="0">inject</tspan><tspan x="1150" dy="21.25">Activation dependency</tspan></text>
  <rect x="1010" y="465" width="280" height="105" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1150" y="502.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1150" dy="0">Activation owns</tspan><tspan x="1150" dy="20">Service · Event · Tool</tspan><tspan x="1150" dy="20">Route · Task · Resource</tspan></text>
  <path d="M 415 400 L 499 400" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="490.33974596215563,405 499,400 490.33974596215563,395" fill="none" stroke="#263238" stroke-width="2.5"/><text x="457" y="390" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="457" dy="0">discover</tspan></text>
  <path d="M 865 400 L 949 400" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="940.3397459621556,405 949,400 940.3397459621556,395" fill="none" stroke="#263238" stroke-width="2.5"/><text x="907" y="390" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="907" dy="0">mount</tspan></text>
  <text x="700" y="705" text-anchor="middle" fill="#7c3aed" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700"><tspan x="700" dy="0">Loader 不根据 Manifest 猜 Service Graph；真实服务状态只来自 Context。</tspan></text>
</svg>
