<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi 2.0 Durable Submission 写路径</title>
  <desc id="desc">命令从 Channel 经 Host、Command Service、SQLite、Worker 和 Lease 进入 Session Actor。</desc>
  <rect width="1400" height="730" fill="#fffdf7"/>
  <text x="50" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="50" dy="0">一次输入先成为 Durable Submission，再进入 Agent</tspan></text>
  <text x="52" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="52" dy="0">202 Accepted 只证明命令已落盘；真正完成要等待 turn/end。</tspan></text>
  <rect x="45" y="230" width="170" height="105" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="130" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="130" dy="0">Web / Blog</tspan><tspan x="130" dy="20">Live2D / App</tspan></text>
  <rect x="260" y="230" width="170" height="105" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="345" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="345" dy="0">Host</tspan><tspan x="345" dy="20">auth + DTO</tspan></text>
  <rect x="475" y="230" width="170" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="560" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="560" dy="0">Command Service</tspan><tspan x="560" dy="20">admission + idempotency</tspan></text>
  <rect x="720" y="230" width="230" height="105" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="835" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="835" dy="0">SQLite Transaction</tspan><tspan x="835" dy="20">accepted + projection + outbox</tspan></text>
  <rect x="995" y="230" width="170" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1080" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1080" dy="0">Worker + Lease</tspan><tspan x="1080" dy="20">claim + fencing</tspan></text>
  <rect x="1205" y="230" width="170" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1290" y="277.94" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1290" dy="0">Session Actor</tspan><tspan x="1290" dy="20">FIFO dispatch</tspan></text>
  <path d="M 215 282 L 254 282" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="245.3397459621556,287 254,282 245.3397459621556,277" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 430 282 L 469 282" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="460.33974596215563,287 469,282 460.33974596215563,277" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 645 282 L 714 282" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="705.3397459621556,287 714,282 705.3397459621556,277" fill="none" stroke="#263238" stroke-width="2.5"/><text x="679.5" y="272" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="679.5" dy="0">commit</tspan></text>
  <path d="M 950 282 L 989 282" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="980.3397459621556,287 989,282 980.3397459621556,277" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 1165 282 L 1199 282" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="1190.3397459621556,287 1199,282 1190.3397459621556,277" fill="none" stroke="#263238" stroke-width="2.5"/>
  <rect x="520" y="430" width="300" height="90" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="670" y="459.53" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="670" dy="0">HTTP 202 Receipt</tspan><tspan x="670" dy="21.25">operationId · submissionId</tspan><tspan x="670" dy="21.25">durableCursor</tspan></text>
  <path d="M 835 335 L 700 424" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="704.4783340731822,415.05882983446935 700,424 709.9824475395002,423.4077659912438" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="767.5" y="369.5" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="767.5" dy="0">提交后即可返回</tspan></text>
  <rect x="1030" y="430" width="300" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1180" y="459.53" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1180" dy="0">Active Turn</tspan><tspan x="1180" dy="21.25">model · tools · approval</tspan><tspan x="1180" dy="21.25">最终产生 turn/end</tspan></text>
  <path d="M 1290 335 L 1180 424" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="1183.5875886264998,414.665697249017 1180,424 1189.877537622216,422.4397915133855" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="1235" y="369.5" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="1235" dy="0">异步继续</tspan></text>
  <rect x="230" y="600" width="940" height="64" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="700" y="638.46" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600"><tspan x="700" dy="0">submission/completed ≠ turn/end　　Receipt 生命周期 ≠ Agent 回答生命周期</tspan></text>
</svg>
