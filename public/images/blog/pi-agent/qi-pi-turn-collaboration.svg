<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi Turn 插件协作时序</title>
  <desc id="desc">Session、Agent Loop、Provider、Tool、Capability 与 UI 插件协作完成一次 Turn。</desc>
  <rect width="1400" height="780" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">一次 Turn，不是一个函数，而是多个插件的协作</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">Agent Loop 只负责推进状态；消息、模型、工具、审批和持久化分别属于不同插件。</tspan></text>
  <rect x="70" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="150" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="150" dy="0">Session Plugin</tspan></text>
  <path d="M 150 189 L 150 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <rect x="280" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="360" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="360" dy="0">Agent Loop Plugin</tspan></text>
  <path d="M 360 189 L 360 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <rect x="490" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="570" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="570" dy="0">Provider Plugin</tspan></text>
  <path d="M 570 189 L 570 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <rect x="700" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="780" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="780" dy="0">Tool / Approval</tspan></text>
  <path d="M 780 189 L 780 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <rect x="910" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="990" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="990" dy="0">Capability Plugin</tspan></text>
  <path d="M 990 189 L 990 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <rect x="1120" y="135" width="160" height="54" rx="18" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="1200" y="166.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1200" dy="0">UI / Control</tspan></text>
  <path d="M 1200 189 L 1200 690" fill="none" stroke="#667085" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
  <path d="M 360 225 L 150 225" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="158.6602540378444,220 150,225 158.6602540378444,230" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="255" y="215" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="255" dy="0">turn/start</tspan></text>
  <path d="M 360 285 L 150 285" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="158.6602540378444,280 150,285 158.6602540378444,290" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="255" y="275" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="255" dy="0">derive_messages()</tspan></text>
  <path d="M 360 345 L 570 345" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="561.3397459621556,350 570,345 561.3397459621556,340" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><text x="465" y="335" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="465" dy="0">stream request</tspan></text>
  <path d="M 570 405 L 360 405" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="368.66025403784437,400 360,405 368.66025403784437,410" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><text x="465" y="395" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="465" dy="0">assistant/chunk*</tspan></text>
  <path d="M 360 465 L 780 465" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="771.3397459621556,470 780,465 771.3397459621556,460" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><text x="570" y="455" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="570" dy="0">tool/call</tspan></text>
  <path d="M 780 525 L 990 525" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="981.3397459621556,530 990,525 981.3397459621556,520" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><text x="885" y="515" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="885" dy="0">approved execute</tspan></text>
  <path d="M 990 585 L 780 585" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="788.6602540378444,580 780,585 788.6602540378444,590" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><text x="885" y="575" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="885" dy="0">ToolResult</tspan></text>
  <path d="M 780 635 L 150 635" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="158.6602540378444,630 150,635 158.6602540378444,640" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><text x="465" y="625" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="465" dy="0">tool/result + checkpoint</tspan></text>
  <path d="M 150 675 L 1200 675" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="1191.3397459621556,680 1200,675 1191.3397459621556,670" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><text x="675" y="665" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="675" dy="0">persistent facts / realtime control</tspan></text>
  <text x="700" y="742" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="700" dy="0">如果模型继续请求工具，就回到下一 Step；没有工具调用时才结束 Turn。</tspan></text>
</svg>
