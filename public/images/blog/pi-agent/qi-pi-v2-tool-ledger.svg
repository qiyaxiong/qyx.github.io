<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi 2.0 Tool Ledger</title>
  <desc id="desc">工具执行边界以及进程崩溃后的恢复决策。</desc>
  <rect width="1600" height="750" fill="#fffdf7"/>
  <text x="50" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700"><tspan x="50" dy="0">Tool 的难点不是调用函数，而是知道崩溃前走到了哪里</tspan></text>
  <text x="52" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="52" dy="0">准备与提交按模型顺序；只有执行主体可以并行。</tspan></text>
  <rect x="35" y="180" width="155" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="112.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="112.5" dy="0">freeze args</tspan><tspan x="112.5" dy="17.5">operation id</tspan></text>
  <rect x="225" y="180" width="155" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="302.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="302.5" dy="0">pre-execute</tspan><tspan x="302.5" dy="17.5">deny check</tspan></text>
  <rect x="415" y="180" width="155" height="90" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="492.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="492.5" dy="0">approval</tspan><tspan x="492.5" dy="17.5">monotonic guards</tspan></text>
  <rect x="605" y="180" width="155" height="90" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="682.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="682.5" dy="0">LEDGER</tspan><tspan x="682.5" dy="17.5">prepared</tspan></text>
  <rect x="795" y="180" width="155" height="90" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="872.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="872.5" dy="0">LEDGER</tspan><tspan x="872.5" dy="17.5">dispatched</tspan></text>
  <rect x="985" y="180" width="155" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1062.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1062.5" dy="0">wrappers</tspan><tspan x="1062.5" dy="17.5">tool body</tspan></text>
  <rect x="1175" y="180" width="155" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1252.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1252.5" dy="0">materialize + post</tspan><tspan x="1252.5" dy="17.5">finalize + freeze</tspan></text>
  <rect x="1365" y="180" width="155" height="90" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1442.5" y="221.01" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1442.5" dy="0">persistent result</tspan><tspan x="1442.5" dy="17.5">ledger committed</tspan></text>
  <path d="M 190 225 L 219 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="210.3397459621556,230 219,225 210.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 380 225 L 409 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="400.33974596215563,230 409,225 400.33974596215563,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 570 225 L 599 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="590.3397459621556,230 599,225 590.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 760 225 L 789 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="780.3397459621556,230 789,225 780.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 950 225 L 979 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="970.3397459621556,230 979,225 970.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 1140 225 L 1169 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="1160.3397459621556,230 1169,225 1160.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 1330 225 L 1359 225" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="1350.3397459621556,230 1359,225 1350.3397459621556,220" fill="none" stroke="#263238" stroke-width="2.5"/>
  <rect x="700" y="350" width="350" height="90" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="875" y="379.53" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="875" dy="0">CRASH WINDOW</tspan><tspan x="875" dy="21.25">请求可能已到外部系统</tspan><tspan x="875" dy="21.25">但本地尚无最终结果</tspan></text>
  <path d="M 875 270 L 875 344" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="870,335.33974596215563 875,344 880,335.33974596215563" fill="none" stroke="#be185d" stroke-width="2.5"/><text x="875" y="297" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="875" dy="0">process dies</tspan></text>
  <rect x="100" y="535" width="225" height="90" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="212.5" y="575.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="212.5" dy="0">有 durable value</tspan><tspan x="212.5" dy="20">直接完成</tspan></text>
  <rect x="375" y="535" width="225" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="487.5" y="575.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="487.5" dy="0">可 reconcile</tspan><tspan x="487.5" dy="20">查询外部结果</tspan></text>
  <rect x="650" y="535" width="225" height="90" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="762.5" y="575.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="762.5" dy="0">只读 / 幂等</tspan><tspan x="762.5" dy="20">原 key 重试</tspan></text>
  <rect x="925" y="535" width="225" height="90" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="1037.5" y="575.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1037.5" dy="0">修改型结果未知</tspan><tspan x="1037.5" dy="20">attention_required</tspan></text>
  <path d="M 875 440 L 875 510" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="870,501.33974596215563 875,510 880,501.33974596215563" fill="none" stroke="#263238" stroke-width="2.5"/><text x="875" y="465" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="875" dy="0">recovery reducer</tspan></text>
  <text x="800" y="700" text-anchor="middle" fill="#be185d" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700"><tspan x="800" dy="0">“没有 tool/result”不能推出“工具没有产生副作用”。</tspan></text>
</svg>
