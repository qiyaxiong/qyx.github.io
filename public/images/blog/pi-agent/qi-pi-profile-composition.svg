<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi Profile 与原子装配</title>
  <desc id="desc">Profile、Bundle、Context Tree 和 Activation Transaction 的关系。</desc>
  <rect width="1400" height="780" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">Profile 不是配置清单，而是一棵待装配的 Context Tree</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">Bundle 负责复用组合，Patch 只覆盖节点；Loader 在事务中解析、挂载、检查健康并提交。</tspan></text>
  <rect x="60" y="155" width="250" height="100" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="185" y="199.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="185" dy="0">Profile</tspan><tspan x="185" dy="22.32">headless / live2d / ...</tspan></text>
  <rect x="375" y="155" width="250" height="100" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="500" y="199.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="500" dy="0">Bundle + Overlay</tspan><tspan x="500" dy="22.32">组合与差异覆盖</tspan></text>
  <rect x="690" y="135" width="300" height="140" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="840" y="188.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="840" dy="0">Context Tree</tspan><tspan x="840" dy="22.32">PluginNode · GroupNode</tspan><tspan x="840" dy="22.32">children · isolate</tspan></text>
  <rect x="1055" y="155" width="280" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1195" y="190.6" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1195" dy="0">Bootstrap / Loader</tspan><tspan x="1195" dy="19.84">解析配置树 · 导入插件</tspan><tspan x="1195" dy="19.84">不推断 Service Graph</tspan></text>
  <path d="M 310 205 L 369 205" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="360.33974596215563,210 369,205 360.33974596215563,200" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><text x="339.5" y="184" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="339.5" dy="0">select</tspan></text>
  <path d="M 625 205 L 684 205" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="675.3397459621556,210 684,205 675.3397459621556,200" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><text x="654.5" y="184" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="654.5" dy="0">merge</tspan></text>
  <path d="M 990 205 L 1049 205" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="1040.3397459621556,210 1049,205 1040.3397459621556,200" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="1019.5" y="184" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="1019.5" dy="0">resolve</tspan></text>
  <rect x="105" y="335" width="1190" height="330" rx="28" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="700" y="375" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700"><tspan x="700" dy="0">Affected-node Incremental Reconciliation</tspan></text>
  <rect x="130" y="430" width="180" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="220" y="472.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">1  Preflight</tspan><tspan x="220" dy="17.36">affected candidates</tspan></text>
  <rect x="370" y="430" width="180" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="460" y="472.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="460" dy="0">2  Dispose</tspan><tspan x="460" dy="17.36">affected old subtree</tspan></text>
  <rect x="610" y="430" width="180" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="700" y="472.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="700" dy="0">3  Mount</tspan><tspan x="700" dy="17.36">affected new subtree</tspan></text>
  <rect x="850" y="430" width="180" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="940" y="472.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="940" dy="0">4  Quiescence</tspan><tspan x="940" dy="17.36">Context lifecycle</tspan></text>
  <rect x="1090" y="430" width="180" height="92" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1180" y="472.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1180" dy="0">5  Postcondition</tspan><tspan x="1180" dy="17.36">then commit</tspan></text>
  <path d="M 310 476 L 364 476" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/><polyline points="355.33974596215563,481 364,476 355.33974596215563,471" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 550 476 L 604 476" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/><polyline points="595.3397459621556,481 604,476 595.3397459621556,471" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 790 476 L 844 476" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/><polyline points="835.3397459621556,481 844,476 835.3397459621556,471" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1030 476 L 1084 476" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/><polyline points="1075.3397459621556,481 1084,476 1075.3397459621556,471" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="345" y="570" width="710" height="52" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="700" y="601.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="700" dy="0">失败 → 释放已创建节点 → 重新挂载 previous tree，恢复旧节点</tspan></text>
  <text x="700" y="720" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="700" dy="0">关键点：运行中的 Run 持有自己的装配快照，不会在热重载中途被换掉。</tspan></text>
</svg>
