<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi Context 与 Activation 所有权</title>
  <desc id="desc">PluginHandle、Activation、Context 和可逆副作用之间的包含与生命周期关系。</desc>
  <rect width="1400" height="780" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">插件为什么能安全卸载：每个副作用都有主人</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">注册工具、监听事件、启动任务或打开连接时，资源会自动归属当前 Activation。</tspan></text>
  <rect x="70" y="145" width="1260" height="500" rx="28" fill="#faf9ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="110" y="185" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700"><tspan x="110" dy="0">Root Context</tspan></text>
  <rect x="140" y="230" width="310" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="295" y="268.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="295" dy="0">PluginHandle</tspan><tspan x="295" dy="22.32">稳定插件身份</tspan><tspan x="295" dy="22.32">拥有 child Context</tspan></text>
  <rect x="545" y="230" width="310" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="700" y="268.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="700" dy="0">Activation</tspan><tspan x="700" dy="22.32">一次 apply() 的生命</tspan><tspan x="700" dy="22.32">reload 时可替换</tspan></text>
  <rect x="950" y="230" width="310" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1105" y="269.7" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1105" dy="0">handle.context</tspan><tspan x="1105" dy="21.08">Service 可见性</tspan><tspan x="1105" dy="21.08">事件与子插件边界</tspan></text>
  <path d="M 450 285 L 539 285" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="530.3397459621556,290 539,285 530.3397459621556,280" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><text x="494.5" y="264" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="494.5" dy="0">owns current</tspan></text>
  <path d="M 855 285 L 944 285" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="935.3397459621556,290 944,285 935.3397459621556,280" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><text x="899.5" y="264" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="899.5" dy="0">executes in</tspan></text>
  <rect x="150" y="435" width="180" height="84" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="240" y="472.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="240" dy="0">Service</tspan><tspan x="240" dy="18.6">ctx.provide()</tspan></text>
  <rect x="390" y="435" width="180" height="84" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="480" y="472.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="480" dy="0">Listener</tspan><tspan x="480" dy="18.6">ctx.on()</tspan></text>
  <rect x="630" y="435" width="180" height="84" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="720" y="472.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="720" dy="0">Task / Timer</tspan><tspan x="720" dy="18.6">ctx.effect()</tspan></text>
  <rect x="870" y="435" width="180" height="84" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="960" y="472.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="960" dy="0">Route / Tool</tspan><tspan x="960" dy="18.6">register()</tspan></text>
  <rect x="1110" y="435" width="180" height="84" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1200" y="472.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="1200" dy="0">Socket / File</tspan><tspan x="1200" dy="18.6">external resource</tspan></text>
  <path d="M 700 340 L 240 429" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="247.55279641901876,422.445973279513 240,429 249.45235184653313,432.2639002082389" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 700 340 L 480 429" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="486.15309736821274,421.1171456453076 480,429 489.9033008096028,430.3873114554852" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 700 340 L 720 429" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="713.2228857205879,421.64672032057877 720,429 722.9795698638046,419.4542070299683" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 700 340 L 960 429" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="950.1871919963888,430.9258242610024 960,429 953.425783264942,421.4647711169147" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 700 340 L 1200 429" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="1190.597538227779,432.4049541291953 1200,429 1192.3499923392858,422.5597063117423" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="260" y="565" width="880" height="52" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="700" y="596.78" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="700" dy="0">reload / unload → 串行 LIFO dispose → 注册撤销、任务停止、连接关闭</tspan></text>
  <text x="700" y="716" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="700" dy="0">因此热重载不是“再执行一遍代码”，而是旧实例干净退出、新实例原子接管。</tspan></text>
</svg>
