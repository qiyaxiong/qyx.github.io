<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi Session 唯一事实源</title>
  <desc id="desc">Session Event Log 如何派生模型上下文、恢复状态、SQLite、Trace 和统计投影。</desc>
  <rect width="1400" height="780" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">Session Event Log：把“现在发生了什么”变成可恢复事实</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">模型历史、UI 时间线、统计和崩溃恢复都从同一份 append-only 事件流派生。</tspan></text>
  <rect x="70" y="190" width="250" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="195" y="224.70000000000002" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="195" dy="0">运行时事件</tspan><tspan x="195" dy="21.08">turn / step / message</tspan><tspan x="195" dy="21.08">tool / approval / checkpoint</tspan></text>
  <rect x="420" y="155" width="310" height="170" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="575" y="211.12" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600"><tspan x="575" dy="0">Session Event Log</tspan><tspan x="575" dy="23.56">seq · time · type · data</tspan><tspan x="575" dy="23.56">JSONL / Zstd</tspan><tspan x="575" dy="23.56">唯一持久事实</tspan></text>
  <path d="M 320 240 L 414 240" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="405.33974596215563,245 414,240 405.33974596215563,235" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><text x="367" y="218" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="367" dy="0">append + flush</tspan></text>
  <rect x="870" y="135" width="360" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1050" y="169.70000000000002" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1050" dy="0">Model Context</tspan><tspan x="1050" dy="21.08">derive_messages()</tspan><tspan x="1050" dy="21.08">压缩后仍可重建</tspan></text>
  <rect x="870" y="285" width="360" height="100" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="1050" y="319.7" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1050" dy="0">Recovery State</tspan><tspan x="1050" dy="21.08">checkpoint + ledger</tspan><tspan x="1050" dy="21.08">不序列化协程栈</tspan></text>
  <path d="M 730 205 L 864 185" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="856.1727173375388,191.2236360852748 864,185 854.6965317150119,181.3331924143445" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><text x="797" y="170" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="797" dy="0">derive</tspan></text>
  <path d="M 730 275 L 864 335" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="854.0525960444103,336.02428245338757 864,335 858.1392433969208,326.89743669944727" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><text x="797" y="292" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="797" dy="0">reduce</tspan></text>
  <rect x="115" y="450" width="1170" height="225" rx="24" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="700" y="490" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700"><tspan x="700" dy="0">可重建投影：坏了可以删，不能反过来污染事实源</tspan></text>
  <rect x="170" y="540" width="250" height="82" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="295" y="576.5200000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="295" dy="0">SQLite</tspan><tspan x="295" dy="19.84">Session / Run / Usage</tspan></text>
  <rect x="475" y="540" width="250" height="82" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="600" y="576.5200000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="600" dy="0">Trace Timeline</tspan><tspan x="600" dy="19.84">Turn / Step / Tool</tspan></text>
  <rect x="780" y="540" width="250" height="82" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="905" y="576.5200000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="905" dy="0">Statistics</tspan><tspan x="905" dy="19.84">Token / Cost / Error</tspan></text>
  <rect x="1085" y="540" width="150" height="82" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1160" y="576.5200000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1160" dy="0">SDK</tspan><tspan x="1160" dy="19.84">Replay</tspan></text>
  <path d="M 575 325 L 575 444" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="570,435.33974596215563 575,444 580,435.33974596215563" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="490" y="408" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="490" dy="0">subscribe / rebuild</tspan></text>
  <text x="700" y="735" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="700" dy="0">Telemetry 投影失败不会阻塞 Agent Run；它只是事实流的消费者。</tspan></text>
</svg>
