<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi 2.0 两个事实边界</title>
  <desc id="desc">Context Graph 与 Session Event Log 分别承担进程内事实和持久事实。</desc>
  <rect width="1400" height="720" fill="#fffdf7"/>
  <text x="50" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700"><tspan x="50" dy="0">两种真相，各自回答一个问题</tspan></text>
  <text x="52" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="52" dy="0">Context Graph 管“现在有什么能力”；Session Event Log 管“已经发生了什么”。</tspan></text>
  <rect x="70" y="145" width="580" height="500" rx="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="360" y="190" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700"><tspan x="360" dy="0">Context Graph · 进程内事实</tspan></text>
  <rect x="125" y="240" width="220" height="82" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="235" y="276.155" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="235" dy="0">Service Truth</tspan><tspan x="235" dy="21.25">ctx.provide()</tspan></text>
  <rect x="375" y="240" width="220" height="82" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="485" y="276.155" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="485" dy="0">Plugin Lifecycle</tspan><tspan x="485" dy="21.25">Activation</tspan></text>
  <rect x="125" y="370" width="220" height="82" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="235" y="406.155" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="235" dy="0">Event Listener</tspan><tspan x="235" dy="21.25">Dispatch</tspan></text>
  <rect x="375" y="370" width="220" height="82" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="485" y="406.155" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="485" dy="0">Effect Owner</tspan><tspan x="485" dy="21.25">LIFO dispose</tspan></text>
  <rect x="150" y="510" width="420" height="80" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="360" y="545.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="360" dy="0">进程重启后由 Profile 重新装配</tspan><tspan x="360" dy="20">不序列化 Python 对象</tspan></text>
  <rect x="750" y="145" width="580" height="500" rx="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1040" y="190" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700"><tspan x="1040" dy="0">Session Event Log · 持久事实</tspan></text>
  <rect x="840" y="235" width="400" height="110" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1040" y="284.585" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600"><tspan x="1040" dy="0">session_events</tspan><tspan x="1040" dy="23.75">seq · type · time · data</tspan></text>
  <rect x="800" y="420" width="145" height="75" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="872.5" y="462.6" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="872.5" dy="0">Model Context</tspan></text>
  <rect x="980" y="420" width="145" height="75" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1052.5" y="462.6" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="1052.5" dy="0">UI Timeline</tspan></text>
  <rect x="1160" y="420" width="145" height="75" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1232.5" y="462.6" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="1232.5" dy="0">Snapshot</tspan></text>
