  <path d="M 1040 345 L 1052 414" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="1045.5900831254132,406.3245217959474 1052,414 1055.44220067361,404.6111100484349" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="1046" y="369.5" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="1046" dy="0">derive</tspan></text>
  <path d="M 1040 345 L 1232 414" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="1222.1590602576064,415.7764866975521 1232,414 1225.541047519238,406.36573953475136" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="1136" y="369.5" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="1136" dy="0">derive</tspan></text>
  <rect x="820" y="545" width="440" height="58" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1040" y="579.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1040" dy="0">投影可删可重建，不能反写业务真相</tspan></text>
  <path d="M 700 135 L 700 675" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7"/>
</svg>
