<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
  <title id="title">qi-pi 2.0 Session Actor</title>
  <desc id="desc">同一 Session 的输入、Steer、Interrupt、Approval 和 Recover 如何排序。</desc>
  <rect width="1400" height="730" fill="#fffdf7"/>
  <text x="50" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="50" dy="0">Session Actor：控制命令可以穿过正在运行的 Turn</tspan></text>
  <text x="52" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="52" dy="0">同一 Session 严格排序，跨 Session 并行；内存队列不是事实源。</tspan></text>
  <rect x="65" y="160" width="245" height="430" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="187" y="205" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700"><tspan x="187" dy="0">Submission Queue</tspan></text>
  <rect x="95" y="240" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="263.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">User Input</tspan></text>
  <rect x="95" y="292" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="315.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">Steer</tspan></text>
  <rect x="95" y="344" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="367.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">Interrupt</tspan></text>
  <rect x="95" y="396" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="419.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">Approval</tspan></text>
  <rect x="95" y="448" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="471.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">Recover</tspan></text>
  <rect x="95" y="500" width="185" height="38" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="187.5" y="523.76" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="187.5" dy="0">Maintenance</tspan></text>
  <rect x="400" y="160" width="410" height="430" rx="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="605" y="205" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="605" dy="0">一个长期 submission loop</tspan></text>
  <rect x="455" y="245" width="300" height="70" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="605" y="275.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="605" dy="0">按 sequence 接收命令</tspan><tspan x="605" dy="20">控制命令优先结算归属</tspan></text>
  <rect x="455" y="355" width="300" height="70" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="605" y="385.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="605" dy="0">Pending Turn FIFO</tspan><tspan x="605" dy="20">有界队列</tspan></text>
  <rect x="455" y="465" width="300" height="70" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="605" y="505.78" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="605" dy="0">最多一个 Active Turn Task</tspan></text>
  <path d="M 310 375 L 394 375" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="385.33974596215563,380 394,375 385.33974596215563,370" fill="none" stroke="#263238" stroke-width="2.5"/><text x="352" y="365" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400"><tspan x="352" dy="0">submit</tspan></text>
  <path d="M 605 315 L 605 349" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="600,340.33974596215563 605,349 610,340.33974596215563" fill="none" stroke="#263238" stroke-width="2.5"/>
  <path d="M 605 425 L 605 459" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="600,450.33974596215563 605,459 610,450.33974596215563" fill="none" stroke="#263238" stroke-width="2.5"/>
  <rect x="900" y="165" width="425" height="190" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1112.5" y="242.71" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600"><tspan x="1112.5" dy="0">跨 Session 并行</tspan><tspan x="1112.5" dy="23.75">Session A Actor　Session B Actor</tspan><tspan x="1112.5" dy="23.75">Session C Actor　Session D Actor</tspan></text>
  <rect x="900" y="405" width="425" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1112.5" y="464.53" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1112.5" dy="0">空闲 600s 后回收</tspan><tspan x="1112.5" dy="21.25">下次从 SQLite Event Log 冷恢复</tspan><tspan x="1112.5" dy="21.25">Actor state 不进入持久化</tspan></text>
  <text x="700" y="675" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400"><tspan x="700" dy="0">不需要全局锁；也不允许每个 HTTP 请求绕过 Actor 随意启动 Turn。</tspan></text>
</svg>
