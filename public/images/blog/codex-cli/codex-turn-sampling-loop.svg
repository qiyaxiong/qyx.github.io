<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Codex 一次 Turn 的内部循环</title><desc id="desc">展示 Turn 内部的 StepContext、模型采样、工具执行、follow-up 与压缩。</desc><rect width="1600" height="850" fill="#fffdf7"/><text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">一次用户 Turn，内部可能跑很多次 Sampling Step</tspan></text><text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">模型只要返回 Tool Call，Core 就执行工具、记录结果，再带着新历史发起下一次采样。</tspan></text><text x="200" y="152" text-anchor="middle" fill="#2563eb" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700"><tspan x="200" dy="0">① 接受输入</tspan></text><rect x="75" y="170" width="250" height="112" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="200" y="221.52" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="200" dy="0">TurnInput + pending input</tspan><tspan x="200" dy="19.84">hooks / skills / plugin mentions</tspan></text><text x="530" y="152" text-anchor="middle" fill="#7c3aed" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700"><tspan x="530" dy="0">② 固定 Step 快照</tspan></text><rect x="405" y="170" width="250" height="112" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="530" y="221.52" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="530" dy="0">StepContext</tspan><tspan x="530" dy="19.84">model · tools · permissions · env</tspan></text><text x="860" y="152" text-anchor="middle" fill="#7c3aed" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700"><tspan x="860" dy="0">③ 请求模型</tspan></text><rect x="735" y="170" width="250" height="112" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="860" y="221.52" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="860" dy="0">history.for_prompt()</tspan><tspan x="860" dy="19.84">Responses stream</tspan></text><text x="1190" y="152" text-anchor="middle" fill="#b45309" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700"><tspan x="1190" dy="0">④ 解析输出</tspan></text><rect x="1065" y="170" width="250" height="112" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1190" y="221.52" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="1190" dy="0">message / reasoning</tspan><tspan x="1190" dy="19.84">or tool call</tspan></text><path d="M 325 226 L 399 226" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="390.33974596215563,231 399,226 390.33974596215563,221" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 655 226 L 729 226" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="720.3397459621556,231 729,226 720.3397459621556,221" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 985 226 L 1059 226" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="1050.3397459621556,231 1059,226 1050.3397459621556,221" fill="none" stroke="#263238" stroke-width="2.5"/><rect x="1030" y="365" width="320" height="104" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="1190" y="411.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1190" dy="0">Tool Call</tspan><tspan x="1190" dy="22.32">先持久化 call，再异步执行</tspan></text><rect x="650" y="365" width="300" height="104" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="800" y="411.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="800" dy="0">Tool Result</tspan><tspan x="800" dy="22.32">进入 history + Event</tspan></text><rect x="1030" y="575" width="320" height="104" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1190" y="621.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1190" dy="0">Assistant Final</tspan><tspan x="1190" dy="22.32">没有 follow-up → Turn 完成</tspan></text><path d="M 1190 282 L 1190 359" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="1185,350.33974596215563 1190,359 1195,350.33974596215563" fill="none" stroke="#be185d" stroke-width="2.5"/><text x="1245" y="330" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="1245" dy="0">有工具</tspan></text><path d="M 1030 417 L 956 417" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="964.6602540378444,412 956,417 964.6602540378444,422" fill="none" stroke="#0f766e" stroke-width="2.5"/><path d="M 650 417 L 530 288" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="539.5594668588461,290.9354034432465 530,288 532.2375994772152,297.7464428680194" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="540" y="365" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="540" dy="0">needs_follow_up = true</tspan></text><path d="M 1310 282 L 1310 569" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="1305,560.3397459621556 1310,569 1315,560.3397459621556" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="1390" y="430" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="1390" dy="0">仅最终回答</tspan></text><rect x="90" y="575" width="640" height="104" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="410" y="621.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="410" dy="0">上下文接近上限且仍需继续</tspan><tspan x="410" dy="22.32">→ inline compaction → 保持同一 Turn，再进入下一 Step</tspan></text><path d="M 410 575 L 480 288" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><polyline points="482.8055009776243,297.5983938377496 480,288 473.090297589793,295.2288320358395" fill="none" stroke="#b45309" stroke-width="2.5"/><rect x="170" y="745" width="1260" height="60" rx="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="800" y="781.12" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="800" dy="0">公开协议用 Thread → Turn → Item；StepContext 是 Core 内部“本次采样看到的世界”，不是另一个用户会话。</tspan></text></svg>
