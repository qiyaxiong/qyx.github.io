<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">Codex Thread、Turn、Item 与恢复模型</title><desc id="desc">展示公开对象层级、JSON-RPC 消息、rollout JSONL 和 SQLite 投影的关系。</desc><rect width="1600" height="840" fill="#fffdf7"/><text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">Thread → Turn → Item：UI 状态与持久历史通过事件连接</tspan></text><text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">App Server 暴露对象生命周期；Core 同时把关键事实追加到 rollout，SQLite 主要承担索引与投影。</tspan></text><rect x="55" y="145" width="900" height="560" rx="26" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/><text x="90" y="190" text-anchor="start" fill="#2563eb" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700"><tspan x="90" dy="0">Thread  thr_123</tspan></text><rect x="100" y="230" width="375" height="390" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="130" y="275" text-anchor="start" fill="#7c3aed" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700"><tspan x="130" dy="0">Turn 1 · completed</tspan></text><rect x="135" y="315" width="305" height="56" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="287.5" y="348.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="287.5" dy="0">Item · userMessage</tspan></text><rect x="135" y="395" width="305" height="72" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="287.5" y="426.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="287.5" dy="0">Item · commandExecution</tspan><tspan x="287.5" dy="18.6">started → delta* → completed</tspan></text><rect x="135" y="492" width="305" height="72" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="287.5" y="523.8000000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="287.5" dy="0">Item · agentMessage</tspan><tspan x="287.5" dy="18.6">delta* → authoritative completed</tspan></text><rect x="520" y="230" width="375" height="390" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="550" y="275" text-anchor="start" fill="#7c3aed" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700"><tspan x="550" dy="0">Turn 2 · interrupted</tspan></text><rect x="555" y="315" width="305" height="56" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="707.5" y="348.44" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="707.5" dy="0">Item · userMessage</tspan></text><rect x="555" y="395" width="305" height="72" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="707.5" y="426.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="707.5" dy="0">Item · reasoning</tspan><tspan x="707.5" dy="18.6">streaming lifecycle</tspan></text><rect x="555" y="492" width="305" height="72" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="707.5" y="523.8000000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="707.5" dy="0">Turn status</tspan><tspan x="707.5" dy="18.6">interrupted / failed / completed</tspan></text><rect x="1015" y="145" width="520" height="210" rx="24" fill="#fffaf0" stroke="#b45309" stroke-width="2.5"/><text x="1275" y="190" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700"><tspan x="1275" dy="0">App Server：双向 JSON-RPC</tspan></text><text x="1060" y="240" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="1060" dy="0">request / response：thread/start、turn/start</tspan><tspan x="1060" dy="21.08">notification：item/started、delta、completed</tspan><tspan x="1060" dy="21.08">server request：approval、user input、dynamic tool</tspan></text><rect x="1015" y="405" width="245" height="176" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="1137.5" y="476.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1137.5" dy="0">Rollout JSONL</tspan><tspan x="1137.5" dy="22.32">追加式会话事实</tspan><tspan x="1137.5" dy="22.32">resume / fork / inspect</tspan></text><rect x="1290" y="405" width="245" height="176" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1412.5" y="476.8" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1412.5" dy="0">SQLite State</tspan><tspan x="1412.5" dy="22.32">metadata index</tspan><tspan x="1412.5" dy="22.32">list / search / projections</tspan></text><path d="M 955 250 L 1009 250" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="1000.3397459621556,255 1009,250 1000.3397459621556,245" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="982" y="225" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="982" dy="0">map events</tspan></text><path d="M 955 500 L 1009 500" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="1000.3397459621556,505 1009,500 1000.3397459621556,495" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="982" y="475" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="982" dy="0">append</tspan></text><path d="M 1260 493 L 1284 493" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="1275.3397459621556,498 1284,493 1275.3397459621556,488" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="1272" y="465" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="1272" dy="0">project / backfill</tspan></text><rect x="1015" y="635" width="520" height="70" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1275" y="676.12" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1275" dy="0">resume：读取已存历史 → 重建 Core Session → 继续新的 Turn</tspan></text><text x="800" y="790" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700"><tspan x="800" dy="0">不要把 notification 当持久日志本身：客户端用完成态更新 UI，服务端恢复依赖 rollout / thread store。</tspan></text></svg>
