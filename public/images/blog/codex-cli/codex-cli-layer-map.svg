<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc"><title id="title">Codex CLI 分层架构</title><desc id="desc">展示多种命令入口、ThreadManager 和 codex-core 运行时的依赖关系。</desc><rect width="1600" height="860" fill="#fffdf7"/><text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">Codex CLI 不是一个 Loop，而是一组入口共用一个 Agent Runtime</tspan></text><text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">cli/main.rs 只做解析与分发；交互、自动化和宿主协议最终都落到 codex-core。</tspan></text><rect x="45" y="130" width="1510" height="690" rx="28" fill="#ffffff" stroke="#263238" stroke-width="2.5"/><text x="78" y="174" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700"><tspan x="78" dy="0">Codex 本地运行系统</tspan></text><rect x="95" y="220" width="220" height="86" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="205" y="258.24" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="205" dy="0">codex</tspan><tspan x="205" dy="21.08">交互 TUI</tspan></text><rect x="355" y="220" width="220" height="86" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="465" y="258.24" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="465" dy="0">codex exec</tspan><tspan x="465" dy="21.08">非交互 / JSONL</tspan></text><rect x="615" y="220" width="220" height="86" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="725" y="258.24" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="725" dy="0">codex review</tspan><tspan x="725" dy="21.08">专用自动化入口</tspan></text><rect x="875" y="220" width="220" height="86" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="985" y="258.24" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="985" dy="0">codex app-server</tspan><tspan x="985" dy="21.08">JSON-RPC 宿主边界</tspan></text><rect x="1135" y="220" width="220" height="86" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1245" y="258.24" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="1245" dy="0">mcp-server / tools</tspan><tspan x="1245" dy="21.08">扩展与互操作</tspan></text><text x="78" y="360" text-anchor="start" fill="#2563eb" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700"><tspan x="78" dy="0">Host / Adapter 层：不同交互方式，不复制 Agent 逻辑</tspan></text><rect x="170" y="400" width="1210" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="775" y="444.40000000000003" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600"><tspan x="775" dy="0">ThreadManager + CodexThread</tspan><tspan x="775" dy="24.8">start · resume · fork · submit(Op) · next_event()</tspan></text><rect x="170" y="555" width="1210" height="155" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="775" y="626.62" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600"><tspan x="775" dy="0">codex-core / Session</tspan><tspan x="775" dy="26.04">Turn loop · context · model stream · ToolRouter · hooks · approvals · cancellation</tspan></text><path d="M 205 306 L 300 394" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="290.2488710740908,391.78291076627556 300,394 297.0444911359078,384.44673001772316" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M 465 306 L 520 394" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="511.17008301975875,389.30611396367067 520,394 519.6500660598097,384.0061245636388" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M 725 306 L 740 394" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polyline points="733.6159004959553,386.3030347849002 740,394 743.4737176562992,384.62272504165975" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M 985 306 L 960 394" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="957.5569722363894,384.3030099852466 960,394 967.1763258112152,387.03578088718575" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 1245 306 L 1180 394" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/><polyline points="1181.1235212628224,384.06331544367106 1180,394 1189.1671818865846,390.0046556771317" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M 775 500 L 775 549" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/><polyline points="770,540.3397459621556 775,549 780,540.3397459621556" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="880" y="535" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">shared runtime API</tspan></text><text x="800" y="780" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700"><tspan x="800" dy="0">关键判断：TUI 可以被替换，App Server 可以远程化，但 Thread / Turn / Tool 的语义仍由 Core 决定。</tspan></text></svg>
