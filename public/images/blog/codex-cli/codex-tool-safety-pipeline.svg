<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 890" role="img" aria-labelledby="title desc"><title id="title">Codex Tool Call 与安全流水线</title><desc id="desc">展示 ToolRouter 生命周期、具体 Handler 的审批与沙箱职责，以及取消和结果回灌。</desc><rect width="1600" height="890" fill="#fffdf7"/><text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700"><tspan x="48" dy="0">Tool Call：通用生命周期包裹具体工具，审批与沙箱由工具运行时落实</tspan></text><text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">这不是一条“所有工具都完全相同”的流水线：Router 管生命周期，exec / MCP 等 Handler 决定自己的安全细节。</tspan></text><rect x="55" y="190" width="190" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="150" dy="0">ResponseItem</tspan><tspan x="150" dy="18.6">FunctionCall</tspan></text><rect x="285" y="190" width="190" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="380" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="380" dy="0">ToolRouter</tspan><tspan x="380" dy="18.6">build_tool_call</tspan></text><rect x="515" y="190" width="190" height="92" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="610" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="610" dy="0">PreToolUse Hook</tspan><tspan x="610" dy="18.6">block / rewrite</tspan></text><rect x="745" y="190" width="190" height="92" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="840" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="840" dy="0">并发闸门</tspan><tspan x="840" dy="18.6">read / write lock</tspan></text><rect x="975" y="190" width="190" height="92" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="1070" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="1070" dy="0">具体 Handler</tspan><tspan x="1070" dy="18.6">approval + sandbox</tspan></text><rect x="1205" y="190" width="190" height="92" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1300" y="231.79999999999998" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600"><tspan x="1300" dy="0">PostToolUse Hook</tspan><tspan x="1300" dy="18.6">feedback / block result</tspan></text><path d="M 245 236 L 279 236" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="270.33974596215563,241 279,236 270.33974596215563,231" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 475 236 L 509 236" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="500.33974596215563,241 509,236 500.33974596215563,231" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 705 236 L 739 236" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="730.3397459621556,241 739,236 730.3397459621556,231" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 935 236 L 969 236" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="960.3397459621556,241 969,236 960.3397459621556,231" fill="none" stroke="#263238" stroke-width="2.5"/><path d="M 1165 236 L 1199 236" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/><polyline points="1190.3397459621556,241 1199,236 1190.3397459621556,231" fill="none" stroke="#263238" stroke-width="2.5"/><rect x="760" y="365" width="590" height="260" rx="24" fill="#fff7f9" stroke="#be185d" stroke-width="2.5" stroke-dasharray="9 7"/><text x="1055" y="405" text-anchor="middle" fill="#be185d" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700"><tspan x="1055" dy="0">以 exec_command 为例：安全决策在 Handler 内</tspan></text><rect x="800" y="445" width="150" height="70" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="875" y="476.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="875" dy="0">解析参数</tspan><tspan x="875" dy="17.36">解析 cwd / env</tspan></text><rect x="980" y="445" width="150" height="70" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="1055" y="476.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1055" dy="0">ExecPolicy</tspan><tspan x="1055" dy="17.36">是否需审批</tspan></text><rect x="1160" y="445" width="150" height="70" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="1235" y="476.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1235" dy="0">Approval</tspan><tspan x="1235" dy="17.36">缓存会话决定</tspan></text><rect x="890" y="545" width="240" height="58" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/><text x="1010" y="570.08" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600"><tspan x="1010" dy="0">SandboxManager</tspan><tspan x="1010" dy="17.36">Seatbelt / Landlock / Windows</tspan></text><rect x="1160" y="545" width="150" height="58" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="1235" y="570.36" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600"><tspan x="1235" dy="0">失败后按策略</tspan><tspan x="1235" dy="16.12">升级 / 返回模型</tspan></text><path d="M 950 480 L 974 480" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="965.3397459621556,485 974,480 965.3397459621556,475" fill="none" stroke="#be185d" stroke-width="2.5"/><path d="M 1130 480 L 1154 480" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="1145.3397459621556,485 1154,480 1145.3397459621556,475" fill="none" stroke="#be185d" stroke-width="2.5"/><path d="M 1235 515 L 1125 539" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="1132.3953693167048,532.2688401690689 1125,539 1134.527040068872,542.0389977831688" fill="none" stroke="#be185d" stroke-width="2.5"/><path d="M 1130 574 L 1154 574" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><polyline points="1145.3397459621556,579 1154,574 1145.3397459621556,569" fill="none" stroke="#be185d" stroke-width="2.5"/><path d="M 1070 282 L 1070 359" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><polyline points="1065,350.33974596215563 1070,359 1075,350.33974596215563" fill="none" stroke="#be185d" stroke-width="2.5"/><rect x="250" y="700" width="1100" height="74" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="800" y="743.46" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600"><tspan x="800" dy="0">AnyToolResult → tool finish lifecycle → ResponseItemEnvelope → history → 下一次模型采样</tspan></text><path d="M 1300 282 L 1300 694" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="1295,685.3397459621556 1300,694 1305,685.3397459621556" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="250" y="835" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700"><tspan x="250" dy="0">取消边界：若工具尚未到 terminal outcome，CancellationToken 会中止任务并生成 aborted result；已完成结果不会被伪装成“未执行”。</tspan></text></svg>
