<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="输出层链式法则">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="62" text-anchor="middle" font-family="STIX Two Math, Times New Roman, serif" font-size="44" font-weight="720" fill="#172033" opacity="1">∂C/∂w = (∂C/∂a) · (∂a/∂z) · (∂z/∂w)</text><text x="800" y="112" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" fill="#657083" opacity="1">链式法则把“一条依赖路径”拆成三个可以局部计算的导数</text><text x="800" y="190" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">前向：保存中间量</text><rect x="90" y="245" width="230" height="90" rx="14" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="205" y="300" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#4F8FA5" opacity="1">w, a⁽ᴸ⁻¹⁾</text><path d="M 320 290 L 425 290" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="440" y="245" width="260" height="90" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="570" y="300" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="650" fill="#8A74B5" opacity="1">z = wa⁽ᴸ⁻¹⁾ + b</text><path d="M 700 290 L 805 290" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="820" y="245" width="230" height="90" rx="14" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="935" y="300" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#EE995B" opacity="1">a = σ(z)</text><path d="M 1050 290 L 1155 290" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1170" y="245" width="340" height="90" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="1340" y="300" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#C95B5B" opacity="1">C = ½(a − y)²</text><text x="800" y="430" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">反向：梯度沿相反方向相乘</text><rect x="1190" y="485" width="300" height="85" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="1340" y="537.5" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#C95B5B" opacity="1">∂C/∂a = a − y</text><path d="M 1190 527 L 1070 527" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="780" y="485" width="275" height="85" rx="14" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="917.5" y="537.5" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#EE995B" opacity="1">∂a/∂z = σ′(z)</text><path d="M 780 527 L 660 527" fill="none" stroke="#EE995B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="370" y="485" width="275" height="85" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="507.5" y="537.5" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#8A74B5" opacity="1">∂z/∂w = a⁽ᴸ⁻¹⁾</text><path d="M 370 527 L 250 527" fill="none" stroke="#8A74B5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="70" y="485" width="165" height="85" rx="14" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="152.5" y="537.5" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#4F8FA5" opacity="1">∂C/∂w</text><text x="800" y="690" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="650" fill="#4F8FA5" opacity="1">数值检查：前向缓存 a⁽ᴸ⁻¹⁾、z、a；反向时每个局部导数只使用相邻节点</text><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">对象</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">路径</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">实现</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">w、z、a、C 在单神经元例子中是标量；批量版本会额外保留 batch 轴。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">w 只通过 z 和 a 影响 C，因此总导数等于这条路径上三个局部导数的乘积。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">自动微分保存前向计算图和必要中间量，反向按依赖的逆序累积梯度。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">输出层链式法则@五道口纳什</text>
</svg>