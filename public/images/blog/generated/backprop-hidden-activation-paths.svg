<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="隐藏层梯度的多路径求和">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="62" text-anchor="middle" font-family="STIX Two Math, Times New Roman, serif" font-size="42" font-weight="720" fill="#172033" opacity="1">δ⁽ᴸ⁻¹⁾ = (W⁽ᴸ⁾)ᵀ δ⁽ᴸ⁾ ⊙ σ′(z⁽ᴸ⁻¹⁾)</text><text x="800" y="112" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" fill="#657083" opacity="1">隐藏单元影响多个下一层节点：每条路径贡献一个梯度，最终在隐藏轴上求和</text><text x="800" y="185" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">多条前向路径与一次反向汇总</text><circle cx="250" cy="360" r="42" fill="#DDECF0" stroke="#4F8FA5" stroke-width="3"/><text x="250" y="369" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#4F8FA5" opacity="1">a_k</text><circle cx="650" cy="255" r="42" fill="#E9E4F2" stroke="#8A74B5" stroke-width="3"/><text x="650" y="264" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#8A74B5" opacity="1">z_1</text><circle cx="650" cy="360" r="42" fill="#E9E4F2" stroke="#8A74B5" stroke-width="3"/><text x="650" y="369" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#8A74B5" opacity="1">z_2</text><circle cx="650" cy="465" r="42" fill="#E9E4F2" stroke="#8A74B5" stroke-width="3"/><text x="650" y="474" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#8A74B5" opacity="1">z_3</text><circle cx="1060" cy="255" r="42" fill="#F4DEDE" stroke="#C95B5B" stroke-width="3"/><text x="1060" y="264" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#C95B5B" opacity="1">C_1</text><circle cx="1060" cy="360" r="42" fill="#F4DEDE" stroke="#C95B5B" stroke-width="3"/><text x="1060" y="369" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#C95B5B" opacity="1">C_2</text><circle cx="1060" cy="465" r="42" fill="#F4DEDE" stroke="#C95B5B" stroke-width="3"/><text x="1060" y="474" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#C95B5B" opacity="1">C_3</text><path d="M 292 350 L 602 270" fill="none" stroke="#4F8FA5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 292 360 L 602 360" fill="none" stroke="#4F8FA5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 292 370 L 602 450" fill="none" stroke="#4F8FA5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 692 255 L 1012 255" fill="none" stroke="#8A74B5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 692 360 L 1012 360" fill="none" stroke="#8A74B5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 692 465 L 1012 465" fill="none" stroke="#8A74B5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 1010 235 C 820 205, 440 220, 290 325" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 1010 360 C 820 600, 430 590, 290 395" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 1010 485 C 800 690, 390 655, 276 405" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="1190" y="320" width="290" height="85" rx="14" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="1335" y="372.5" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#EE995B" opacity="1">Σ 路径贡献</text><path d="M 1102 255 C 1145 255, 1145 345, 1175 345" fill="none" stroke="#EE995B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 1102 360 L 1175 360" fill="none" stroke="#EE995B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><path d="M 1102 465 C 1145 465, 1145 380, 1175 380" fill="none" stroke="#EE995B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><text x="800" y="690" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="650" fill="#8A74B5" opacity="1">(n_L × n_L-1)^T · (n_L) → (n_L-1)：转置后的 W 把下一层梯度映射回隐藏层</text><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">形状</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">求和</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">门控</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">W⁽ᴸ⁾∈Rⁿᴸ×ⁿᴸ⁻¹，δ⁽ᴸ⁾∈Rⁿᴸ；乘 Wᵀ 后得到每个隐藏单元的梯度。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">矩阵乘法第 k 个输出是 sum_j W[j,k] delta[j]，把所有下游路径贡献相加。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">再逐元素乘 σ′(z⁽ᴸ⁻¹⁾)，表示隐藏单元的局部激活斜率。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">隐藏层梯度的多路径求和</text>
</svg>