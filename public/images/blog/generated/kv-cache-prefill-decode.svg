<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="KV Cache：Prefill 与 Decode">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="65" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="740" fill="#172033" opacity="1">Prefill 写入 K/V；Decode 只追加新 K/V，并复用全部历史缓存</text><text x="800" y="112" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" fill="#657083" opacity="1">缓存省下的是历史 token 的 K/V 投影，不是注意力读取，也不是模型参数</text><text x="800" y="185" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">Prefill · 一次处理完整提示词</text><rect x="95" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="143" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="191" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="239" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="287" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="335" y="245" width="40" height="48" rx="7" fill="#4F8FA588" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="383" y="245" width="40" height="48" rx="7" fill="#4F8FA5" stroke="#FFFFFF" stroke-width="2" opacity="1"/><text x="259" y="327" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#4F8FA5" opacity="1">tokens · B × T</text><path d="M 435 270 L 535 270" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="550" y="230" width="230" height="80" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="665" y="280" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#8A74B5" opacity="1">QKV projection</text><path d="M 780 270 L 880 270" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="895" y="215" width="520" height="110" rx="14" fill="#F8FAFC" stroke="#EE995B" stroke-width="2" opacity="1"/><rect x="925" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="973" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="1021" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="1069" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="1117" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="1165" y="238" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="1213" y="238" width="40" height="48" rx="7" fill="#EE995B" stroke="#FFFFFF" stroke-width="2" opacity="1"/><text x="1089" y="320" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#EE995B" opacity="1">K cache · B × h × T × d_h</text><text x="1380" y="260" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#657083" opacity="1">+</text><text x="1380" y="300" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="750" fill="#5D9872" opacity="1">V</text><text x="800" y="430" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">Decode · 每次只处理一个新 token</text><rect x="95" y="490" width="40" height="48" rx="7" fill="#4F8FA5" stroke="#FFFFFF" stroke-width="2" opacity="1"/><text x="115" y="572" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#4F8FA5" opacity="1">x_t · B × 1</text><path d="M 155 515 L 285 515" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="300" y="475" width="230" height="80" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="415" y="525" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#8A74B5" opacity="1">q_t, k_t, v_t</text><path d="M 530 515 L 650 515" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="665" y="460" width="390" height="125" rx="14" fill="#F8FAFC" stroke="#EE995B" stroke-width="2" opacity="1"/><rect x="695" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="743" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="791" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="839" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="887" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="935" y="486" width="40" height="48" rx="7" fill="#EE995B88" stroke="#FFFFFF" stroke-width="2" opacity="1"/><rect x="983" y="486" width="40" height="48" rx="7" fill="#EE995B" stroke="#FFFFFF" stroke-width="2" opacity="1"/><text x="859" y="568" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#EE995B" opacity="1">历史 K/V</text><text x="1018" y="527" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#657083" opacity="1">+</text><rect x="1065" y="483" width="40" height="48" rx="7" fill="#C95B5B" stroke="#FFFFFF" stroke-width="2" opacity="1"/><text x="1085" y="563" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650" fill="#C95B5B" opacity="1">追加 1 格</text><path d="M 1110 515 L 1210 515" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1225" y="475" width="285" height="80" rx="14" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="1367.5" y="525" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#5D9872" opacity="1">q_t K_1:t^T → 1 × T</text><text x="800" y="690" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="650" fill="#C95B5B" opacity="1">计算量：每步仍需读取长度 T 的 K/V；显存：每生成一个 token，缓存沿 T 轴增长一格</text><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">复用</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">形状</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">边界</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">历史 K/V 不再重复投影；新 token 仍要生成 q_t、k_t、v_t，并把 k_t、v_t 追加到缓存。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">prefill 的 Q/K/V 含 T 行；decode 的 q_t 只有 1 行，但会与 T 行历史 K 做点积。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">KV cache 降低重复计算，却不会消除随上下文长度增长的读取成本和显存占用。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">KV Cache：Prefill 与 Decode@五道口纳什</text>
</svg>