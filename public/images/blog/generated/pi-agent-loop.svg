<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Pi Agent Loop">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="72" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="750" fill="#172033" opacity="1">下一步 = f（当前会话状态，模型输出，工具结果）</text><text x="800" y="122" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" fill="#657083" opacity="1">循环不是无限重试：每一轮都有类型检查、权限边界和明确退出条件</text><rect x="90" y="275" width="220" height="145" rx="18" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="200" y="330" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750" fill="#4F8FA5" opacity="1">请求</text><text x="200" y="375" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#172033" opacity="1">user message</text><path d="M 310 347 L 362 347" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="380" y="275" width="220" height="145" rx="18" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="490" y="330" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750" fill="#8A74B5" opacity="1">推理</text><text x="490" y="375" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#172033" opacity="1">model response</text><path d="M 600 347 L 652 347" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="670" y="275" width="220" height="145" rx="18" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="780" y="330" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750" fill="#EE995B" opacity="1">校验</text><text x="780" y="375" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#172033" opacity="1">schema + permission</text><path d="M 890 347 L 942 347" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="960" y="275" width="220" height="145" rx="18" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="1070" y="330" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750" fill="#C95B5B" opacity="1">执行</text><text x="1070" y="375" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#172033" opacity="1">tool handler</text><path d="M 1180 347 L 1232 347" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1250" y="275" width="220" height="145" rx="18" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="1360" y="330" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="750" fill="#5D9872" opacity="1">观察</text><text x="1360" y="375" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#172033" opacity="1">structured result</text><path d="M 1360 420 C 1360 610, 490 650, 490 435" fill="none" stroke="#4F8FA5" stroke-width="4" opacity="1" marker-end="url(#arrow)"/><text x="910" y="618" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="650" fill="#4F8FA5" opacity="1">需要继续：把 observation 追加到会话，再次调用模型</text><path d="M 1360 420 L 1360 690" fill="none" stroke="#5D9872" stroke-width="4" opacity="1" marker-end="url(#arrow)"/><rect x="1220" y="690" width="280" height="60" rx="14" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="1360" y="730" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#5D9872" opacity="1">完成 / 拒绝 / 预算耗尽</text><rect x="650" y="500" width="300" height="60" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="800" y="540" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#C95B5B" opacity="1">失败 → 结构化错误 → 模型恢复</text><path d="M 1070 420 L 930 500" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 650 530 C 540 530, 490 485, 490 435" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">状态</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">边界</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">退出</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">会话历史、工具结果、预算、取消信号和当前分支共同决定下一轮。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">模型只提出 tool call；运行时负责 schema 校验、授权和真正执行。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">最终回答、显式拒绝、不可恢复错误、取消或资源预算耗尽都会停止循环。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">Pi Agent Loop@五道口纳什</text>
</svg>