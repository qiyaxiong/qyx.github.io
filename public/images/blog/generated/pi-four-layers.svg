<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Pi 四层可替换架构">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="72" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="750" fill="#172033" opacity="1">Pi 的四层不是四张海报，而是四组稳定接口</text><text x="800" y="120" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" fill="#657083" opacity="1">上层只依赖下层契约；模型、工具和界面都可以独立替换</text><rect x="220" y="180" width="1160" height="100" rx="18" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="270" y="220" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="750" fill="#8A74B5" opacity="1">交互层 · pi-coding-agent</text><text x="270" y="256" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#172033" opacity="1">TUI · CLI · session tree · extensions</text><path d="M 800 281 L 800 310" fill="none" stroke="#8A74B5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="220" y="315" width="1160" height="100" rx="18" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="270" y="355" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="750" fill="#4F8FA5" opacity="1">执行层 · agent loop</text><text x="270" y="391" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#172033" opacity="1">message → model → tool → observation → stop</text><path d="M 800 416 L 800 445" fill="none" stroke="#4F8FA5" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="220" y="450" width="1160" height="100" rx="18" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="270" y="490" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="750" fill="#EE995B" opacity="1">核心层 · pi-agent-core</text><text x="270" y="526" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#172033" opacity="1">state · events · tool contract · context management</text><path d="M 800 551 L 800 580" fill="none" stroke="#EE995B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="220" y="585" width="1160" height="100" rx="18" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="270" y="625" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="750" fill="#5D9872" opacity="1">模型层 · pi-ai</text><text x="270" y="661" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#172033" opacity="1">OpenAI · Anthropic · Google · local providers</text><rect x="50" y="315" width="130" height="60" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="115" y="355" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#C95B5B" opacity="1">扩展 API</text><path d="M 180 345 L 218 345" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1420" y="315" width="130" height="60" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="1485" y="355" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#C95B5B" opacity="1">工具契约</text><path d="M 1420 345 L 1382 345" fill="none" stroke="#C95B5B" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">边界</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">契约</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">替换</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">Provider 只负责模型协议；Core 维护状态；Loop 调度工具；UI/Extension 面向用户。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">层间传递结构化 message、tool schema、event 与 result，不共享隐式实现细节。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">更换模型、终端界面或扩展包时，Agent Core 与会话状态无需重写。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">Pi 四层可替换架构</text>
</svg>