<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="GRPO 的组内相对优势">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="62" text-anchor="middle" font-family="STIX Two Math, Times New Roman, serif" font-size="40" font-weight="720" fill="#172033" opacity="1">Âᵢ = (rᵢ − mean(r₁…rᴳ)) / (std(r₁…rᴳ) + ε)</text><text x="800" y="112" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" fill="#657083" opacity="1">GRPO 在同一个 prompt 的候选组内部建立相对基线，不需要单独训练 value network</text><text x="230" y="190" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">同一 prompt 采样 G 个回答</text><rect x="70" y="230" width="320" height="82" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="230" y="281" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#8A74B5" opacity="1">x：一道可验证问题</text><rect x="70" y="365" width="245" height="60" rx="14" fill="#4F8FA522" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="192.5" y="405" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#4F8FA5" opacity="1">回答 y1</text><text x="350" y="404" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#4F8FA5" opacity="1">r1 = 0.2</text><rect x="70" y="447" width="245" height="60" rx="14" fill="#5D987222" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="192.5" y="487" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#5D9872" opacity="1">回答 y2</text><text x="350" y="486" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#5D9872" opacity="1">r2 = 0.8</text><rect x="70" y="529" width="245" height="60" rx="14" fill="#EE995B22" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="192.5" y="569" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#EE995B" opacity="1">回答 y3</text><text x="350" y="568" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#EE995B" opacity="1">r3 = 0.5</text><rect x="70" y="611" width="245" height="60" rx="14" fill="#C95B5B22" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="192.5" y="651" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#C95B5B" opacity="1">回答 y4</text><text x="350" y="650" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#C95B5B" opacity="1">r4 = -0.1</text><path d="M 430 500 L 570 500" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="590" y="310" width="370" height="380" rx="18" fill="#F8FAFC" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="775" y="360" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">组内统计量</text><text x="775" y="435" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#EE995B" opacity="1">μ = mean(r)</text><text x="775" y="485" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#EE995B" opacity="1">σ = std(r)</text><text x="775" y="560" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#657083" opacity="1">只比较同一问题的回答</text><text x="775" y="600" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#657083" opacity="1">不同 prompt 不共享基线</text><path d="M 960 500 L 1080 500" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><text x="1280" y="190" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">标准化优势 Â</text><text x="1110" y="404" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#4F8FA5" opacity="1">Â1</text><rect x="1222.8" y="379" width="57.2" height="30" rx="5" fill="#4F8FA5" stroke="#4F8FA5" stroke-width="2" opacity="0.8"/><text x="1475" y="404" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#4F8FA5" opacity="1">-0.52</text><text x="1110" y="486" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#5D9872" opacity="1">Â2</text><rect x="1280" y="461" width="149.60000000000002" height="30" rx="5" fill="#5D9872" stroke="#5D9872" stroke-width="2" opacity="0.8"/><text x="1475" y="486" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#5D9872" opacity="1">1.36</text><text x="1110" y="568" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#EE995B" opacity="1">Â3</text><rect x="1280" y="543" width="46.199999999999996" height="30" rx="5" fill="#EE995B" stroke="#EE995B" stroke-width="2" opacity="0.8"/><text x="1475" y="568" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#EE995B" opacity="1">0.42</text><text x="1110" y="650" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#C95B5B" opacity="1">Â4</text><rect x="1141.4" y="625" width="138.6" height="30" rx="5" fill="#C95B5B" stroke="#C95B5B" stroke-width="2" opacity="0.8"/><text x="1475" y="650" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="650" fill="#C95B5B" opacity="1">-1.26</text><path d="M 1280 345 L 1280 690" fill="none" stroke="#AEB7C3" stroke-width="2" opacity="1"/><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">轴</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">对象</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">更新</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">每个 prompt 形成一个大小为 G 的回答组；奖励和优势都是沿 group 轴长度为 G 的向量。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">rᵢ 是可验证奖励或奖励模型分数；Âᵢ 是组内标准化后的相对优势。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">正优势提高对应回答的概率，负优势降低概率；PPO/GRPO 目标再限制更新幅度。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">GRPO 的组内相对优势</text>
</svg>