<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Pi 插件即插即用机制">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="800" y="68" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="760" fill="#172033" opacity="1">插件即插即用 = 发现 + 契约 + 注册 + 隔离执行</text><text x="800" y="116" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" fill="#657083" opacity="1">Agent Core 不认识插件实现，只认识能力声明与统一调用协议</text><rect x="70" y="245" width="180" height="130" rx="16" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="160" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#4F8FA5" opacity="1">发现</text><text x="160" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">扫描包/目录</text><path d="M 250 310 L 292 310" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="310" y="245" width="180" height="130" rx="16" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="400" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#8A74B5" opacity="1">声明</text><text x="400" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">manifest</text><path d="M 490 310 L 532 310" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="550" y="245" width="180" height="130" rx="16" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="640" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#EE995B" opacity="1">校验</text><text x="640" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">schema/version</text><path d="M 730 310 L 772 310" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="790" y="245" width="180" height="130" rx="16" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="880" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#5D9872" opacity="1">注册</text><text x="880" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">registry</text><path d="M 970 310 L 1012 310" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1030" y="245" width="180" height="130" rx="16" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="1120" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#C95B5B" opacity="1">分发</text><text x="1120" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">name → handler</text><path d="M 1210 310 L 1252 310" fill="none" stroke="#657083" stroke-width="3" opacity="1" marker-end="url(#arrow)"/><rect x="1270" y="245" width="180" height="130" rx="16" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="1360" y="294" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="750" fill="#4F8FA5" opacity="1">返回</text><text x="1360" y="338" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#172033" opacity="1">result/error</text><text x="800" y="455" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#657083" opacity="1">Extension Registry：能力名与处理器的稳定映射</text><rect x="315" y="485" width="970" height="205" rx="18" fill="#FAFBFC" stroke="#B8C1CD" stroke-width="2" opacity="1"/><rect x="350" y="525" width="250" height="60" rx="14" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="475" y="565" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#4F8FA5" opacity="1">tool: browser.search</text><rect x="675" y="525" width="250" height="60" rx="14" fill="#E9E4F2" stroke="#8A74B5" stroke-width="2" opacity="1"/><text x="800" y="565" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#8A74B5" opacity="1">command: /review</text><rect x="1000" y="525" width="250" height="60" rx="14" fill="#FBE8D9" stroke="#EE995B" stroke-width="2" opacity="1"/><text x="1125" y="565" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#EE995B" opacity="1">provider: local-llm</text><rect x="350" y="610" width="250" height="60" rx="14" fill="#E1EFE6" stroke="#5D9872" stroke-width="2" opacity="1"/><text x="475" y="650" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#5D9872" opacity="1">prompt: coding-style</text><rect x="675" y="610" width="250" height="60" rx="14" fill="#F4DEDE" stroke="#C95B5B" stroke-width="2" opacity="1"/><text x="800" y="650" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#C95B5B" opacity="1">ui: status-panel</text><rect x="1000" y="610" width="250" height="60" rx="14" fill="#DDECF0" stroke="#4F8FA5" stroke-width="2" opacity="1"/><text x="1125" y="650" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#4F8FA5" opacity="1">lifecycle: dispose()</text><rect x="70" y="790" width="1460" height="155" rx="16" fill="#F8FAFC" stroke="#D9E0E8" stroke-width="2" opacity="1"/><text x="105" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">契约</text><text x="105" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">隔离</text><text x="105" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172033" opacity="1">卸载</text><text x="245" y="829" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">manifest 声明名称、版本、能力、输入 schema、权限需求和生命周期钩子。</text><text x="245" y="874" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">加载失败、执行超时与结构化错误停留在插件边界，不污染 Agent Core 状态。</text><text x="245" y="919" text-anchor="start" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="450" fill="#657083" opacity="1">从 registry 移除 handler 并执行 dispose；其他插件和会话协议保持不变。</text>
  <text x="800" y="978" text-anchor="middle" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="450" fill="#98A1AF" opacity="1">Pi 插件即插即用机制@五道口纳什</text>
</svg>