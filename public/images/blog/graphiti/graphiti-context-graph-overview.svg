<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Graphiti Context Graph 核心对象</title>
  <desc id="desc">展示 Episode、Entity、Fact、有效时间和 provenance 的关系。</desc>
  <rect width="1400" height="800" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">Graphiti：从原始证据长出一张会随时间变化的图</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">Episode 保留“原话”，Entity 与 Fact 是可检索的派生结构；每条事实都能回到证据。</tspan></text>
  <rect x="55" y="145" width="360" height="530" rx="26" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="235" y="188" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="235" dy="0">Episode：证据层</tspan></text>
  <text x="235" y="220" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400"><tspan x="235" dy="0">原始输入不被派生事实替代</tspan></text>
  <rect x="92" y="270" width="286" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="235" y="311.23999999999995" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="235" dy="0">1 月 10 日 · message</tspan><tspan x="235" dy="21.08">“我现在在上海办公”</tspan></text>
  <rect x="92" y="410" width="286" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="235" y="451.23999999999995" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="235" dy="0">2 月 2 日 · message</tspan><tspan x="235" dy="21.08">“1 月 20 日调到杭州了”</tspan></text>
  <rect x="92" y="550" width="286" height="82" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="235" y="586.5200000000001" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600"><tspan x="235" dy="0">JSON / 文本 / 对话</tspan><tspan x="235" dy="19.84">都先成为 Episode</tspan></text>
  <rect x="505" y="145" width="835" height="530" rx="26" fill="#f7fffd" stroke="#0f766e" stroke-width="2.5"/>
  <text x="922" y="188" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="922" dy="0">Context Graph：派生的上下文层</tspan></text>
  <rect x="585" y="300" width="190" height="88" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="680" y="338.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="680" dy="0">Entity</tspan><tspan x="680" dy="22.32">小洛</tspan></text>
  <rect x="1060" y="240" width="190" height="88" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1155" y="278.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1155" dy="0">Entity</tspan><tspan x="1155" dy="22.32">上海</tspan></text>
  <rect x="1060" y="460" width="190" height="88" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="1155" y="498.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="1155" dy="0">Entity</tspan><tspan x="1155" dy="22.32">杭州</tspan></text>
  <path d="M 775 328 L 1054 284" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><polyline points="1046.2243771442238,290.28805925582213 1054,284 1044.666569516068,280.41014270456196" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/><text x="914.5" y="270" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="914.5" dy="0">办公地 · valid 1/1 → invalid 1/20</tspan></text>
  <path d="M 775 360 L 1054 504" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><polyline points="1044.0111047677774,504.4711390874053 1054,504 1048.59753396548,495.5849325168566" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/><text x="914.5" y="455" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="914.5" dy="0">办公地 · valid 1/20 → now</tspan></text>
  <path d="M 415 316 L 579 326" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="570.0514878751794,330.46364545544776 579,326 570.660113579685,320.4821839015562" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="497" y="292" text-anchor="middle" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400"><tspan x="497" dy="0">MENTIONS / provenance</tspan></text>
  <path d="M 415 456 L 579 370" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="573.6523579520984,378.4500132856414 579,370 569.0082528083678,369.5938127789922" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="922" y="606" text-anchor="middle" fill="#0f766e" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700"><tspan x="922" dy="0">旧事实失效，但不会被删除；查询既能问“现在”，也能问“当时”。</tspan></text>
  <text x="700" y="744" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700"><tspan x="700" dy="0">关键分工：Episode 是证据，Entity / Fact 是可更新、可检索、可追溯的解释。</tspan></text>
</svg>
