  <rect x="100" y="355" width="355" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="277.5" y="395.96" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600"><tspan x="277.5" dy="0">Agent Loop</tspan><tspan x="277.5" dy="22.32">Turn · Step · Tool · Approval</tspan></text>
  <rect x="100" y="515" width="355" height="105" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="277.5" y="552.1999999999999" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600"><tspan x="277.5" dy="0">Session Event Log</tspan><tspan x="277.5" dy="21.08">sequence · replay · recovery</tspan><tspan x="277.5" dy="21.08">运行事实的唯一来源</tspan></text>
