<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Graphiti 作为 qi-pi Memory 插件</title>
  <desc id="desc">展示 Session Event Log、Memory Outbox、Graphiti 和查询时 Context Provider 的边界。</desc>
  <rect width="1400" height="800" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">把 Graphiti 接进 qi-pi：它应是 Memory 插件，不是新的事实源</tspan></text>
  <text x="50" y="94" text-anchor="start" fill="#667085" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400"><tspan x="50" dy="0">Session Event Log 负责运行恢复与审计；Graphiti 负责把事件派生为可检索的长期语义关系。</tspan></text>
  <rect x="55" y="145" width="445" height="520" rx="26" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="277" y="188" text-anchor="middle" fill="#263238" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="277" dy="0">qi-pi Agent Runtime</tspan></text>
