<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL 查询路径</title>
  <desc id="desc">SQL 从客户端经过解析、规划、执行，最后访问缓冲区和磁盘</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#a5f3fc" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">一条 SELECT 是怎么跑完的</text>
  <text x="60" y="116" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="34" font-weight="700">先翻译，再规划，最后取数据</text>
  <style>
    .label { fill:#f8fafc; font:700 22px system-ui,sans-serif; }
    .small { fill:#cbd5e1; font:500 17px system-ui,sans-serif; }
    .arrow { stroke:#67e8f9; stroke-width:4; stroke-linecap:round; }
  </style>
  <g filter="url(#shadow)">
    <rect x="55" y="210" width="190" height="150" rx="20" fill="#1e3a8a"/>
    <text x="150" y="270" text-anchor="middle" class="label">SQL</text><text x="150" y="305" text-anchor="middle" class="small">SELECT ...</text>
    <rect x="295" y="210" width="190" height="150" rx="20" fill="#155e75"/>
    <text x="390" y="270" text-anchor="middle" class="label">Parser</text><text x="390" y="305" text-anchor="middle" class="small">看懂语法</text>
    <rect x="535" y="210" width="190" height="150" rx="20" fill="#0f766e"/>
    <text x="630" y="270" text-anchor="middle" class="label">Planner</text><text x="630" y="305" text-anchor="middle" class="small">选择走哪条路</text>
    <rect x="775" y="210" width="190" height="150" rx="20" fill="#047857"/>
    <text x="870" y="270" text-anchor="middle" class="label">Executor</text><text x="870" y="305" text-anchor="middle" class="small">按计划执行</text>
    <rect x="1015" y="210" width="130" height="150" rx="20" fill="#b45309"/>
    <text x="1080" y="270" text-anchor="middle" class="label">页</text><text x="1080" y="305" text-anchor="middle" class="small">缓存/磁盘</text>
  </g>
  <path d="M245 285h45M485 285h45M725 285h45M965 285h45" class="arrow"/><path d="m278 273 14 12-14 12M518 273l14 12-14 12M758 273l14 12-14 12M998 273l14 12-14 12" fill="none" class="arrow"/>
  <rect x="110" y="445" width="980" height="80" rx="18" fill="#ecfeff"/>
  <text x="600" y="480" text-anchor="middle" fill="#164e63" font-family="system-ui,sans-serif" font-size="22" font-weight="700">优化慢查询时，先问：慢在规划、等待，还是读了太多页？</text>
  <text x="600" y="510" text-anchor="middle" fill="#155e75" font-family="system-ui,sans-serif" font-size="18">EXPLAIN (ANALYZE, BUFFERS) 会把这条路径照亮。</text>
</svg>
