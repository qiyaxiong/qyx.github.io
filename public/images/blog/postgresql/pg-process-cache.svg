<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL 进程与缓存</title>
  <desc id="desc">连接池、后端进程、共享缓冲区和磁盘之间的关系</desc>
  <rect width="1200" height="650" rx="28" fill="#ecfeff"/>
  <text x="60" y="70" fill="#164e63" font-family="system-ui,sans-serif" font-size="34" font-weight="700">连接很多，不等于应该启动很多数据库进程</text>
  <text x="60" y="112" fill="#475569" font-family="system-ui,sans-serif" font-size="20">连接池做“多对少”，Shared Buffers 做“大家常用的页放一起”。</text>
  <style>.h{fill:#0f172a;font:700 22px system-ui,sans-serif}.s{fill:#334155;font:500 18px system-ui,sans-serif}.a{stroke:#0891b2;stroke-width:4;stroke-linecap:round}</style>
  <rect x="70" y="220" width="190" height="110" rx="18" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/><text x="165" y="270" text-anchor="middle" class="h">应用连接</text><text x="165" y="302" text-anchor="middle" class="s">1000 个请求</text>
  <rect x="340" y="200" width="220" height="150" rx="18" fill="#7dd3fc" stroke="#0284c7" stroke-width="2"/><text x="450" y="260" text-anchor="middle" class="h">PgBouncer</text><text x="450" y="296" text-anchor="middle" class="s">复用少量连接</text>
  <path d="M260 275h70" class="a"/><path d="m315 263 14 12-14 12" fill="none" class="a"/>
  <rect x="650" y="160" width="220" height="110" rx="18" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="760" y="210" text-anchor="middle" class="h">Backend A/B/C</text><text x="760" y="242" text-anchor="middle" class="s">各自执行 SQL</text>
  <path d="M560 255h70M760 270v55" class="a"/><path d="m615 243 14 12-14 12M748 312l12 14 12-14" fill="none" class="a"/>
  <rect x="590" y="350" width="340" height="130" rx="20" fill="#5eead4" stroke="#0f766e" stroke-width="2"/><text x="760" y="405" text-anchor="middle" class="h">Shared Buffers</text><text x="760" y="442" text-anchor="middle" class="s">常用数据页 / 索引页</text>
  <path d="M760 480v50" class="a"/><path d="m748 518 12 14 12-14" fill="none" class="a"/>
  <rect x="620" y="545" width="280" height="55" rx="15" fill="#cbd5e1"/><text x="760" y="580" text-anchor="middle" class="h">数据文件 + pg_wal</text>
  <rect x="70" y="420" width="420" height="120" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="100" y="468" class="h">看性能时别只看命中率</text><text x="100" y="505" class="s">还要看锁等待、读了多少页、WAL 刷盘和连接排队。</text>
</svg>
