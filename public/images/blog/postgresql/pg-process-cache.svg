<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">连接很多，不等于数据库要开很多份缓存</title><desc id="desc">每个连接有自己的 Backend，但 Shared Buffers 是大家共享的暂存区</desc>
  <rect width="1200" height="690" fill="#fffdf7"/>
  <text x="48" y="58" text-anchor="start" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700"><tspan x="48" dy="0">连接很多，不等于数据库要开很多份缓存</tspan></text>
  <text x="50" y="95" text-anchor="start" fill="#64748b" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400"><tspan x="50" dy="0">每个连接有自己的 Backend，但 Shared Buffers 是大家共享的暂存区</tspan></text>
  <rect x="55" y="140" width="1090" height="450" rx="26" fill="#ffffff" fill-opacity="1" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
      <text x="180" y="195" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="180" dy="0">客户端侧</tspan></text>
      <rect x="90" y="230" width="180" height="92" rx="16" fill="#fef3c7" fill-opacity="1" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><text x="180" y="286" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700"><tspan x="180" dy="0">Web / API</tspan></text>
      <rect x="320" y="230" width="180" height="92" rx="16" fill="#fef3c7" fill-opacity="1" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><text x="410" y="286" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700"><tspan x="410" dy="0">PgBouncer</tspan></text>
      <path d="M 270 276 L 312 276" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 302.47372055837116,281.5 L 312,276 L 302.47372055837116,270.5" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="291" y="250" text-anchor="middle" fill="#64748b" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400"><tspan x="291" dy="0">复用连接</tspan></text>
      <text x="815" y="195" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="815" dy="0">PostgreSQL 内部</tspan></text>
      <rect x="610" y="220" width="210" height="115" rx="18" fill="#dbeafe" fill-opacity="1" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><text x="715" y="274" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700"><tspan x="715" dy="0">Backend 1</tspan></text>
      <rect x="875" y="220" width="210" height="115" rx="18" fill="#dbeafe" fill-opacity="1" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><text x="980" y="274" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700"><tspan x="980" dy="0">Backend 2</tspan></text>
      <path d="M 500 276 L 602 276" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 592.4737205583712,281.5 L 602,276 L 592.4737205583712,270.5" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="335" y="400" width="530" height="115" rx="20" fill="#ede9fe" fill-opacity="1" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/><text x="600" y="450" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700"><tspan x="600" dy="0">Shared Buffers</tspan><tspan x="600" dy="28.75">所有 Backend 共享的热数据暂存区</tspan></text>
      <path d="M 715 335 L 600 395" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 980 335 L 715 395" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="900" y="400" width="185" height="115" rx="18" fill="#ccfbf1" fill-opacity="1" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><text x="992" y="448" text-anchor="middle" fill="#1f2937" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700"><tspan x="992" dy="0">磁盘</tspan><tspan x="992" dy="26.25">持久数据</tspan></text>
      <path d="M 865 458 L 892 458" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 882.4737205583712,463.5 L 892,458 L 882.4737205583712,452.5" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="878" y="430" text-anchor="middle" fill="#64748b" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400"><tspan x="878" dy="0">淘汰/写回</tspan></text>
      <text x="600" y="560" text-anchor="middle" fill="#64748b" font-family="'Comic Sans MS','Bradley Hand','Marker Felt','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400"><tspan x="600" dy="0">连接池减少连接开销；共享缓冲区减少磁盘读取。两者解决的不是同一个问题。</tspan></text>
</svg>