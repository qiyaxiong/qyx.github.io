<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL B-Tree 与 WAL</title>
  <desc id="desc">索引定位 TID，回表读取数据，同时更新先写 WAL</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">两个比喻：电话簿 + 记账本</text>
  <text x="60" y="116" fill="white" font-family="system-ui,sans-serif" font-size="34" font-weight="700">B-Tree 找得快，WAL 保证不丢</text>
  <style>.h{fill:#fff;font:700 22px system-ui,sans-serif}.s{fill:#ddd6fe;font:500 18px system-ui,sans-serif}.a{stroke:#a78bfa;stroke-width:4;stroke-linecap:round}</style>
  <rect x="60" y="180" width="500" height="390" rx="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="100" y="230" class="h">B-Tree：像查电话簿</text>
  <rect x="145" y="280" width="330" height="58" rx="14" fill="#4338ca"/><text x="310" y="317" text-anchor="middle" class="h">根：50</text>
  <path d="M310 338v38M310 376l-110 45M310 376l110 45" class="a"/>
  <rect x="110" y="420" width="170" height="58" rx="14" fill="#6366f1"/><text x="195" y="457" text-anchor="middle" class="h">10 · TID</text>
  <rect x="340" y="420" width="170" height="58" rx="14" fill="#6366f1"/><text x="425" y="457" text-anchor="middle" class="h">80 · TID</text>
  <text x="100" y="530" class="s">先找到行的物理地址 TID，再回表拿完整数据。</text>
  <rect x="640" y="180" width="500" height="390" rx="22" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="230" class="h">WAL：像先写收据</text>
  <rect x="705" y="285" width="370" height="76" rx="16" fill="#b45309"/><text x="890" y="332" text-anchor="middle" class="h">先写 WAL：我要改哪一页</text>
  <path d="M890 365v48" class="a"/><path d="m878 401 12 14 12-14" fill="none" class="a"/>
  <rect x="705" y="430" width="370" height="76" rx="16" fill="#92400e"/><text x="890" y="477" text-anchor="middle" class="h">再写数据页：真正修改内容</text>
  <text x="680" y="545" class="s">崩溃重启时，按收据把没写完的修改补回来。</text>
</svg>
