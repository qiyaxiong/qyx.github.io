<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL 仓库类比总览</title>
  <desc id="desc">表、数据页、B-Tree、Shared Buffers、WAL 和 MVCC 的关系图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/><stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#182944"/><stop offset="1" stop-color="#21294a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#8ad7ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f1f5ff" font-size="29" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">把 PostgreSQL 想成一座会做账的仓库</text>
  <text x="56" y="96" fill="#a9b8cf" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每个组件只解决一个问题，但它们连起来才构成数据库的核心能力</text>

  <g filter="url(#shadow)">
    <rect x="58" y="150" width="300" height="142" rx="20" fill="url(#card)" stroke="#58c8ff" stroke-width="2"/>
    <rect x="450" y="150" width="300" height="142" rx="20" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
    <rect x="842" y="150" width="300" height="142" rx="20" fill="url(#card)" stroke="#66e3b4" stroke-width="2"/>
    <rect x="58" y="360" width="300" height="142" rx="20" fill="url(#card)" stroke="#f6c86e" stroke-width="2"/>
    <rect x="450" y="360" width="300" height="142" rx="20" fill="url(#card)" stroke="#ff9bc5" stroke-width="2"/>
    <rect x="842" y="360" width="300" height="142" rx="20" fill="url(#card)" stroke="#8ad7ff" stroke-width="2"/>
  </g>

  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="86" y="195" font-size="25" font-weight="700">表</text><text x="86" y="229" font-size="18" fill="#c7d3e6">仓库里的货架</text><text x="86" y="260" font-size="16" fill="#9db1cc">用户看到的业务数据</text>
    <text x="478" y="195" font-size="25" font-weight="700">数据页 Page</text><text x="478" y="229" font-size="18" fill="#c7d3e6">货架上的箱子（通常 8KB）</text><text x="478" y="260" font-size="16" fill="#9db1cc">真正从磁盘读写的单位</text>
    <text x="870" y="195" font-size="25" font-weight="700">B-Tree 索引</text><text x="870" y="229" font-size="18" fill="#c7d3e6">货架旁边的目录</text><text x="870" y="260" font-size="16" fill="#9db1cc">先找到行的位置，再取货</text>
    <text x="86" y="405" font-size="25" font-weight="700">Shared Buffers</text><text x="86" y="439" font-size="18" fill="#c7d3e6">仓库门口的暂存区</text><text x="86" y="470" font-size="16" fill="#9db1cc">热点页面不用反复读磁盘</text>
    <text x="478" y="405" font-size="25" font-weight="700">WAL</text><text x="478" y="439" font-size="18" fill="#c7d3e6">改货物前先写下的收据</text><text x="478" y="470" font-size="16" fill="#9db1cc">崩溃后可以按收据重放</text>
    <text x="870" y="405" font-size="25" font-weight="700">MVCC</text><text x="870" y="439" font-size="18" fill="#c7d3e6">旧版本和新版本并存</text><text x="870" y="470" font-size="16" fill="#9db1cc">读写并发时互不堵死</text>
  </g>

  <g stroke="#8ad7ff" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".95">
    <path d="M358 221 H438"/><path d="M750 221 H830"/><path d="M992 292 V350"/>
    <path d="M842 431 H762"/><path d="M450 431 H370"/><path d="M208 360 V302"/>
  </g>
  <text x="602" y="332" text-anchor="middle" fill="#d5e7ff" font-size="17" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">查询先找目录，修改先留收据，读取尽量走缓存</text>
</svg>
