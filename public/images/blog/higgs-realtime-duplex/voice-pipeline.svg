<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="从司机的声音，到助手的回答"><title>从司机的声音，到助手的回答</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#176ea2"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="53" text-anchor="start" font-size="30" fill="#173247" font-weight="650">从司机的声音，到助手的回答</text><text x="40" y="88" text-anchor="start" font-size="20" fill="#617789" font-weight="500">语音流水线 · 逻辑职责示意</text><rect x="120" y="120" width="520" height="84" rx="14" fill="#fff" stroke="#cfdee8" stroke-width="1.6"/><text x="380" y="154" text-anchor="middle" font-size="26" fill="#173247" font-weight="650">司机开口</text><text x="380" y="184" text-anchor="middle" font-size="21" fill="#617789" font-weight="500">声音进入系统</text><path d="M 380 208 L 380 224" fill="none" stroke="#176ea2" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="120" y="230" width="520" height="84" rx="14" fill="#fff" stroke="#cfdee8" stroke-width="1.6"/><text x="380" y="264" text-anchor="middle" font-size="26" fill="#173247" font-weight="650">ASR · 语音识别</text><text x="380" y="294" text-anchor="middle" font-size="21" fill="#617789" font-weight="500">将声音转换为文字</text><path d="M 380 318 L 380 334" fill="none" stroke="#176ea2" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="120" y="340" width="520" height="84" rx="14" fill="#e8f3fc" stroke="#8dbbd8" stroke-width="1.6"/><text x="380" y="374" text-anchor="middle" font-size="26" fill="#173247" font-weight="650">语言模型</text><text x="380" y="404" text-anchor="middle" font-size="21" fill="#617789" font-weight="500">理解要求、查询工具、生成回答</text><path d="M 380 428 L 380 444" fill="none" stroke="#176ea2" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="120" y="450" width="520" height="84" rx="14" fill="#fff" stroke="#cfdee8" stroke-width="1.6"/><text x="380" y="484" text-anchor="middle" font-size="26" fill="#173247" font-weight="650">TTS · 语音合成</text><text x="380" y="514" text-anchor="middle" font-size="21" fill="#617789" font-weight="500">将回答转换为声音</text><path d="M 380 538 L 380 554" fill="none" stroke="#176ea2" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="120" y="560" width="520" height="84" rx="14" fill="#fff" stroke="#cfdee8" stroke-width="1.6"/><text x="380" y="594" text-anchor="middle" font-size="26" fill="#173247" font-weight="650">司机听见回复</text><text x="380" y="624" text-anchor="middle" font-size="21" fill="#617789" font-weight="500">播放生成的声音</text></svg>