<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">简单工厂、工厂方法与注册表：创建逻辑如何逐步演进 UML</title><desc id="desc">ImportJob 请求抽象 Parser；Registry 集中创建，但允许插件注册新工厂。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 创建关系图 · 简单工厂、工厂方法与注册表</text><text x="55" y="84" class="subtitle">ImportJob 请求抽象 Parser；Registry 集中创建，但允许插件注册新工厂。</text><g><path d="M 225 270 V 295 H 660 V 320" class="edge dashed" marker-end="url(#triangle)"/><rect x="368.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="442.5" y="285" class="edge-label">asks to create</text></g><g><path d="M 660 320 V 295 H 1095 V 270" class="edge" marker-end="url(#triangle)"/><rect x="803.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="285" class="edge-label">creates</text></g><g><path d="M 1095 525 V 397.5 H 1095 V 270" class="edge dashed" marker-end="url(#triangle)"/><rect x="1021" y="370.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="1095" y="387.5" class="edge-label">implements</text></g><g id="job"><rect x="55" y="115" width="340" height="155" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Client»</text><text x="225" y="180" class="class-name">ImportJob</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">+ run(kind, text)</text></g><g id="registry"><rect x="490" y="320" width="340" height="177" rx="18" class="uml-node node-1"/><text x="660" y="351" class="stereotype">«Factory Registry»</text><text x="660" y="385" class="class-name">ParserRegistry</text><path d="M 490 398 H 830" class="divider"/><text x="512" y="425" class="member">- factories: dict</text><text x="512" y="449" class="member">+ register(kind, factory)</text><text x="512" y="473" class="member">+ create(kind): Parser</text></g><g id="parser"><rect x="925" y="115" width="340" height="155" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Protocol»</text><text x="1095" y="180" class="class-name">Parser</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">+ parse(text): dict</text></g><g id="json"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="1095" y="556" class="stereotype">«Product»</text><text x="1095" y="590" class="class-name">JsonParser</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">+ parse(text): dict</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>