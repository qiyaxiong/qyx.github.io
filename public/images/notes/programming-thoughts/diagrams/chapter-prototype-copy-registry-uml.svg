<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">原型、深浅拷贝与模板注册表：复制不是简单 copy UML</title><desc id="desc">注册和取用都通过 clone()，调用方永远拿不到 Registry 内部保存的原型本体。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 原型图 · 原型、拷贝与模板注册表</text><text x="55" y="84" class="subtitle">注册和取用都通过 clone()，调用方永远拿不到 Registry 内部保存的原型本体。</text><g><path d="M 225 270 V 295 H 660 V 320" class="edge dashed" marker-end="url(#triangle)"/><rect x="368.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="442.5" y="285" class="edge-label">requests by name</text></g><g><path d="M 660 320 V 306 H 1095 V 292" class="edge" marker-start="url(#diamond)"/><rect x="803.5" y="279" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="296" class="edge-label">owns prototype</text></g><g><path d="M 1095 292 V 408.5 H 1095 V 525" class="edge" marker-end="url(#triangle)"/><rect x="1021" y="381.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="1095" y="398.5" class="edge-label">clone()</text></g><g id="client"><rect x="55" y="115" width="340" height="155" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Caller»</text><text x="225" y="180" class="class-name">Client</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">+ create daily workflow</text></g><g id="registry"><rect x="490" y="320" width="340" height="177" rx="18" class="uml-node node-1"/><text x="660" y="351" class="stereotype">«Registry»</text><text x="660" y="385" class="class-name">PrototypeRegistry</text><path d="M 490 398 H 830" class="divider"/><text x="512" y="425" class="member">- items: dict</text><text x="512" y="449" class="member">+ register(name, value)</text><text x="512" y="473" class="member">+ create(name): Workflow</text></g><g id="prototype"><rect x="925" y="115" width="340" height="177" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Prototype»</text><text x="1095" y="180" class="class-name">Workflow</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">- title: str</text><text x="947" y="244" class="member">- steps: list[str]</text><text x="947" y="268" class="member">+ clone(): Workflow</text></g><g id="copy"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="1095" y="556" class="stereotype">«Independent Object»</text><text x="1095" y="590" class="class-name">Workflow copy</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">steps are deep-copied</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>