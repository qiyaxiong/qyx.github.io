<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">享元、状态分离与内存优化：先测量，再共享 UML</title><desc id="desc">Tile 保留外蕴坐标；大量 Tile 通过 TileTypes 共享少量不可变 TileType。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 享元对象图 · 享元、状态分离与内存优化</text><text x="55" y="84" class="subtitle">Tile 保留外蕴坐标；大量 Tile 通过 TileTypes 共享少量不可变 TileType。</text><g><path d="M 225 525 V 408.5 H 225 V 292" class="edge" marker-end="url(#triangle)"/><rect x="151" y="381.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="225" y="398.5" class="edge-label">instances</text></g><g><path d="M 395 203.5 H 925" class="edge" marker-end="url(#triangle)"/><rect x="586" y="174.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="660" y="191.5" class="edge-label">shares</text></g><g><path d="M 660 525 V 408.5 H 1095 V 292" class="edge" marker-start="url(#diamond)"/><rect x="803.5" y="381.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="398.5" class="edge-label">caches by key</text></g><g id="tile"><rect x="55" y="115" width="340" height="177" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Context Object»</text><text x="225" y="180" class="class-name">Tile</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">+ x: int</text><text x="77" y="244" class="member">+ y: int</text><text x="77" y="268" class="member">+ kind: TileType</text></g><g id="factory"><rect x="490" y="525" width="340" height="155" rx="18" class="uml-node node-1"/><text x="660" y="556" class="stereotype">«Flyweight Factory»</text><text x="660" y="590" class="class-name">TileTypes</text><path d="M 490 603 H 830" class="divider"/><text x="512" y="630" class="member">- cache: dict</text><text x="512" y="654" class="member">+ get(texture, walkable)</text></g><g id="type"><rect x="925" y="115" width="340" height="177" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Flyweight»</text><text x="1095" y="180" class="class-name">TileType</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">+ texture: str</text><text x="947" y="244" class="member">+ walkable: bool</text><text x="947" y="268" class="member">immutable</text></g><g id="many"><rect x="55" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="225" y="556" class="stereotype">«Many Contexts»</text><text x="225" y="590" class="class-name">Tile × 1,000,000</text><path d="M 55 603 H 395" class="divider"/><text x="77" y="630" class="member">different x / y</text><text x="77" y="654" class="member">same kind identity</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>