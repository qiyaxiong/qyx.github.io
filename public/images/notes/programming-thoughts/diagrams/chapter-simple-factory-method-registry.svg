  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">简单工厂、工厂方法与注册表</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="384" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P22</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">JSON 与 YAML 两种解析器出现，先</text>
<text x="78" y="258" class="body">把有限创建分支集中到一个入口</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">简单工厂：集中管理有限的创建分支</text><path d="M 448 310 H 464" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="468" y="140" width="384" height="300" rx="24" class="card"/><text x="486" y="172" class="stage">需求 2 · P23</text><text x="486" y="210" class="label">暴露问题</text><text x="486" y="230" class="body">不同导入任务开始拥有各自流程，创建决策需要</text>
