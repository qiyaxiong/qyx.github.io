<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">原型、深浅拷贝与模板注册表：复制不是简单 copy渐进推导图</title><desc id="desc">同一个案例随 P29 到 P31 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">原型、拷贝与模板注册表</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="384" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P29</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">每次创建工作流都重复解析相同固定模板，改为</text>
<text x="78" y="258" class="body">从基准实例复制</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">原型模式（一）：从已有实例复制复杂配置</text><path d="M 448 310 H 464" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="468" y="140" width="384" height="300" rx="24" class="card"/><text x="486" y="172" class="stage">需求 2 · P30</text><text x="486" y="210" class="label">暴露问题</text><text x="486" y="230" class="body">浅拷贝让 steps 列表仍被多个副本共享</text>
<text x="486" y="258" class="body">，修改会污染原型</text><text x="486" y="322" class="label">只做一步</text><text x="486" y="342" class="body action">原型模式（二）：深拷贝、浅拷贝与共享引用</text><path d="M 856 310 H 872" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="876" y="140" width="384" height="300" rx="24" class="card"/><text x="894" y="172" class="stage">需求 3 · P31</text><text x="894" y="210" class="label">暴露问题</text><text x="894" y="230" class="body">模板进入命名注册表后，注册和读取两端都要防</text>
<text x="894" y="258" class="body">御性复制</text><text x="894" y="322" class="label">只做一步</text><text x="894" y="342" class="body action">原型模式（三）：用原型注册表管理命名模板</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>