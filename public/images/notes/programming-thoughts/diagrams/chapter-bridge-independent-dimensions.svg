<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">桥接与两个独立变化维度：停止制造组合子类渐进推导图</title><desc id="desc">同一个案例随 P41 到 P42 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">桥接与独立变化维度</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="588" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P41</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">报表格式与存储目标形成 PdfToS3、CsvToEmail 等</text>
<text x="78" y="258" class="body">组合子类</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">桥接（一）：拆开两个会独立增长的维度</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="588" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 2 · P42</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">格式和存储各自继续增加，改为两个可独立扩展并在运行时组合的维度</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">桥接（二）：让报表格式与存储后端独立演进</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>