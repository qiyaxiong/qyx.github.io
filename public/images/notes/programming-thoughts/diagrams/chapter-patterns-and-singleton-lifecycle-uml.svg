<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">从模式语言到单例生命周期：唯一实例不等于全局变量 UML</title><desc id="desc">唯一实例由组合根缓存，业务用例仍通过构造函数显式接收 Catalog。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 对象与生命周期图 · 模式语言与单例生命周期</text><text x="55" y="84" class="subtitle">唯一实例由组合根缓存，业务用例仍通过构造函数显式接收 Catalog。</text><g><path d="M 225 270 V 295 H 660 V 320" class="edge" marker-end="url(#triangle)"/><rect x="368.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="442.5" y="285" class="edge-label">creates once</text></g><g><path d="M 660 320 V 295 H 1095 V 270" class="edge dashed" marker-end="url(#triangle)"/><rect x="803.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="285" class="edge-label">injects</text></g><g><path d="M 1095 525 V 397.5 H 1095 V 270" class="edge dashed" marker-end="url(#triangle)"/><rect x="1021" y="370.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="1095" y="387.5" class="edge-label">replaces in test</text></g><g id="root"><rect x="55" y="115" width="340" height="155" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Composition Root»</text><text x="225" y="180" class="class-name">application_catalog()</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">@lru_cache(maxsize=1)</text><text x="77" y="244" class="member">+ returns Catalog</text></g><g id="catalog"><rect x="490" y="320" width="340" height="155" rx="18" class="uml-node node-1"/><text x="660" y="351" class="stereotype">«Application Singleton»</text><text x="660" y="385" class="class-name">Catalog</text><path d="M 490 398 H 830" class="divider"/><text x="512" y="425" class="member">- values: dict</text><text x="512" y="449" class="member">+ find(key)</text></g><g id="usecase"><rect x="925" y="115" width="340" height="155" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Use Case»</text><text x="1095" y="180" class="class-name">ShowVersion</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">- catalog: Catalog</text><text x="947" y="244" class="member">+ run(): str</text></g><g id="fake"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="1095" y="556" class="stereotype">«Test Object»</text><text x="1095" y="590" class="class-name">Catalog(test data)</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">version = test</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>