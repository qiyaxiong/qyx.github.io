<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">变化、内聚、耦合与单一职责：从一团代码拆出清晰边界渐进推导图</title><desc id="desc">同一个案例随 P1 到 P4 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">变化、内聚、耦合与职责</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="282" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P1</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">结算、折扣、支付和通知全挤在 </text>
<text x="78" y="258" class="body">checkout() 中，一次</text>
<text x="78" y="286" class="body">活动改动会碰完整流程</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">编程思想：先控制变化，再选择模</text>
<text x="78" y="370" class="body action">式</text><path d="M 346 310 H 362" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="366" y="140" width="282" height="300" rx="24" class="card"/><text x="384" y="172" class="stage">需求 2 · P2</text><text x="384" y="210" class="label">暴露问题</text><text x="384" y="230" class="body">第二种折扣出现后，定价规则开始</text>
<text x="384" y="258" class="body">反复修改结算函数</text><text x="384" y="322" class="label">只做一步</text><text x="384" y="342" class="body action">高内聚：让一起变化的代码待在一</text>
<text x="384" y="370" class="body action">起</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="282" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 3 · P3</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">支付供应商更换后，SDK 字段</text>
<text x="690" y="258" class="body">与错误码渗入业务流程</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">低耦合：让协作依赖稳定接口</text><path d="M 958 310 H 974" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="978" y="140" width="282" height="300" rx="24" class="card"/><text x="996" y="172" class="stage">需求 4 · P4</text><text x="996" y="210" class="label">暴露问题</text><text x="996" y="230" class="body">邮件通知再次变化，结算用例需要</text>
<text x="996" y="258" class="body">只保留编排职责</text><text x="996" y="322" class="label">只做一步</text><text x="996" y="342" class="body action">单一职责：一个模块只对一种变化</text>
<text x="996" y="370" class="body action">负责</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>