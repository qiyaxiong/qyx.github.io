<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">桥接与两个独立变化维度：停止制造组合子类 UML</title><desc id="desc">Report 与 Storage 是两个独立层次，通过组合连接，避免格式 × 后端的子类乘法。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 桥接图 · 桥接与独立变化维度</text><text x="55" y="84" class="subtitle">Report 与 Storage 是两个独立层次，通过组合连接，避免格式 × 后端的子类乘法。</text><g><path d="M 225 525 V 408.5 H 225 V 292" class="edge" marker-end="url(#triangle)"/><rect x="151" y="381.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="225" y="398.5" class="edge-label">extends</text></g><g><path d="M 395 203.5 H 925" class="edge" marker-end="url(#triangle)"/><rect x="586" y="174.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="660" y="191.5" class="edge-label">bridge / has-a</text></g><g><path d="M 1095 525 V 397.5 H 1095 V 270" class="edge dashed" marker-end="url(#triangle)"/><rect x="1021" y="370.5" width="148" height="24" rx="8" class="edge-label-bg"/><text x="1095" y="387.5" class="edge-label">implements</text></g><g id="report"><rect x="55" y="115" width="340" height="177" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Abstraction»</text><text x="225" y="180" class="class-name">Report</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">- storage: Storage</text><text x="77" y="244" class="member">+ render(rows): bytes</text><text x="77" y="268" class="member">+ save(name, rows)</text></g><g id="csv"><rect x="55" y="525" width="340" height="155" rx="18" class="uml-node node-1"/><text x="225" y="556" class="stereotype">«Refined Abstraction»</text><text x="225" y="590" class="class-name">CsvReport</text><path d="M 55 603 H 395" class="divider"/><text x="77" y="630" class="member">+ render(rows): bytes</text></g><g id="storage"><rect x="925" y="115" width="340" height="155" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Implementor»</text><text x="1095" y="180" class="class-name">Storage</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">+ put(name, data): str</text></g><g id="memory"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="1095" y="556" class="stereotype">«Concrete Implementor»</text><text x="1095" y="590" class="class-name">MemoryStorage</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">- files: dict</text><text x="947" y="654" class="member">+ put(name, data): str</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>