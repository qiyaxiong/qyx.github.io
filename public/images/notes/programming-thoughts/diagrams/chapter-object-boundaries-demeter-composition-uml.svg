<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">对象边界、迪米特法则与组合复用：停止穿透对象图 UML</title><desc id="desc">Order 拥有自己的数据，通过两个策略对象完成报价，不再暴露 customer.profile.address 导航链。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 对象关系图 · 对象边界与组合复用</text><text x="55" y="84" class="subtitle">Order 拥有自己的数据，通过两个策略对象完成报价，不再暴露 customer.profile.address 导航链。</text><g><path d="M 660 292 V 306 H 225 V 320" class="edge" marker-end="url(#triangle)"/><rect x="368.5" y="279" width="148" height="24" rx="8" class="edge-label-bg"/><text x="442.5" y="296" class="edge-label">uses</text></g><g><path d="M 660 292 V 306 H 1095 V 320" class="edge" marker-end="url(#triangle)"/><rect x="803.5" y="279" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="296" class="edge-label">uses</text></g><g><path d="M 225 525 V 500 H 225 V 475" class="edge dashed" marker-end="url(#triangle)"/><rect x="151" y="473" width="148" height="24" rx="8" class="edge-label-bg"/><text x="225" y="490" class="edge-label">implements</text></g><g><path d="M 1095 525 V 500 H 1095 V 475" class="edge dashed" marker-end="url(#triangle)"/><rect x="1021" y="473" width="148" height="24" rx="8" class="edge-label-bg"/><text x="1095" y="490" class="edge-label">implements</text></g><g id="order"><rect x="490" y="115" width="340" height="177" rx="18" class="uml-node node-0"/><text x="660" y="146" class="stereotype">«Entity»</text><text x="660" y="180" class="class-name">Order</text><path d="M 490 193 H 830" class="divider"/><text x="512" y="220" class="member">- city: str</text><text x="512" y="244" class="member">- prices: list[int]</text><text x="512" y="268" class="member">+ quote(shipping, discount)</text></g><g id="shipping"><rect x="55" y="320" width="340" height="155" rx="18" class="uml-node node-1"/><text x="225" y="351" class="stereotype">«Protocol»</text><text x="225" y="385" class="class-name">Shipping</text><path d="M 55 398 H 395" class="divider"/><text x="77" y="425" class="member">+ price(city): int</text></g><g id="discount"><rect x="925" y="320" width="340" height="155" rx="18" class="uml-node node-2"/><text x="1095" y="351" class="stereotype">«Protocol»</text><text x="1095" y="385" class="class-name">Discount</text><path d="M 925 398 H 1265" class="divider"/><text x="947" y="425" class="member">+ apply(subtotal): int</text></g><g id="local"><rect x="55" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="225" y="556" class="stereotype">«Strategy»</text><text x="225" y="590" class="class-name">LocalShipping</text><path d="M 55 603 H 395" class="divider"/><text x="77" y="630" class="member">+ price(city): int</text></g><g id="vip"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-0"/><text x="1095" y="556" class="stereotype">«Strategy»</text><text x="1095" y="590" class="class-name">Vip</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">+ apply(subtotal): int</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>