<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">抽象工厂、产品族与契约测试：整套替换数据库实现渐进推导图</title><desc id="desc">同一个案例随 P25 到 P28 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">抽象工厂与产品族</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="282" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P25</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">仓储与事务必须来自同一后端，单</text>
<text x="78" y="258" class="body">独创建会混搭产品</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">抽象工厂（一）：创建相互兼容的</text>
<text x="78" y="370" class="body action">产品族</text><path d="M 346 310 H 362" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="366" y="140" width="282" height="300" rx="24" class="card"/><text x="384" y="172" class="stage">需求 2 · P26</text><text x="384" y="210" class="label">暴露问题</text><text x="384" y="230" class="body">组合根需要一次选择并装配整套存</text>
<text x="384" y="258" class="body">储实现</text><text x="384" y="322" class="label">只做一步</text><text x="384" y="342" class="body action">抽象工厂（二）：实现产品族与装</text>
<text x="384" y="370" class="body action">配入口</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="282" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 3 · P27</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">切换数据库时还要同时替换方言、</text>
<text x="690" y="258" class="body">事务与仓储</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">抽象工厂（三）：切换数据库实现</text>
<text x="690" y="370" class="body action">而不污染业务</text><path d="M 958 310 H 974" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="978" y="140" width="282" height="300" rx="24" class="card"/><text x="996" y="172" class="stage">需求 4 · P28</text><text x="996" y="210" class="label">暴露问题</text><text x="996" y="230" class="body">两套实现必须跑同一组保存、回滚</text>
<text x="996" y="258" class="body">和失败契约测试</text><text x="996" y="322" class="label">只做一步</text><text x="996" y="342" class="body action">抽象工厂（四）：用契约测试校验</text>
<text x="996" y="370" class="body action">产品族</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>