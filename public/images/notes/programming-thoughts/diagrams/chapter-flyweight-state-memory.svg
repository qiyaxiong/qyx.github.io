<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">享元、状态分离与内存优化：先测量，再共享渐进推导图</title><desc id="desc">同一个案例随 P45 到 P46 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">享元、状态分离与内存优化</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="588" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P45</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">百万瓦片各自保存同一纹理和通行规则，内存被重复状态占满</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">享元（一）：分离可共享状态与上下文状态</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="588" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 2 · P46</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">把坐标留在瓦片，把不可变类型放入按键缓存，并用对象身份测量共享结</text>
<text x="690" y="258" class="body">果</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">享元（二）：用共享瓦片降低地图对象开销</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>