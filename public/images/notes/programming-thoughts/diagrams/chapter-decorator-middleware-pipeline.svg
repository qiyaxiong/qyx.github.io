<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">装饰器与中间件组合：顺序本身就是业务语义渐进推导图</title><desc id="desc">同一个案例随 P36 到 P37 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">装饰器与中间件组合</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="588" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P36</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">重试、指标和缓存写在一个函数中，任意组合都要复制控制流</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">装饰器（一）：沿同一接口叠加职责</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="588" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 2 · P37</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">指标包在重试内外含义不同，需要显式组合顺序并用调用次数验证</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">装饰器（二）：组合重试、缓存与可观测性</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>