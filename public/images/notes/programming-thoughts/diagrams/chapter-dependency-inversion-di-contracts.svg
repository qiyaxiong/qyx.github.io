<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">依赖倒置、依赖注入与行为契约：把业务从基础设施里救出来渐进推导图</title><desc id="desc">同一个案例随 P8 到 P11 的需求逐步演进</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/></marker></defs>
  <style>.bg{fill:#0b1220}.card{fill:#111c30;stroke:#334155;stroke-width:2}.title{font:700 27px system-ui;fill:#f8fafc}.subtitle{font:16px system-ui;fill:#94a3b8}.stage{font:700 17px system-ui;fill:#e2e8f0}.label{font:700 13px system-ui;fill:#60a5fa}.body{font:14px system-ui;fill:#cbd5e1}.action{fill:#a7f3d0}.arrow{stroke:#60a5fa;stroke-width:3;fill:none}</style>
  <rect width="100%" height="100%" rx="30" class="bg"/><text x="60" y="60" class="title">依赖、注入与行为契约</text><text x="60" y="96" class="subtitle">同一个案例 · 需求出现后才重构 · 结构完成后才命名</text><g><rect x="60" y="140" width="282" height="300" rx="24" class="card"/><text x="78" y="172" class="stage">需求 1 · P8</text><text x="78" y="210" class="label">暴露问题</text><text x="78" y="230" class="body">下单用例直接创建生产支付和 </text>
<text x="78" y="258" class="body">SQL 审计，单元测试无法隔离</text><text x="78" y="322" class="label">只做一步</text><text x="78" y="342" class="body action">依赖倒置（一）：业务规则不依赖</text>
<text x="78" y="370" class="body action">基础设施</text><path d="M 346 310 H 362" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="366" y="140" width="282" height="300" rx="24" class="card"/><text x="384" y="172" class="stage">需求 2 · P9</text><text x="384" y="210" class="label">暴露问题</text><text x="384" y="230" class="body">测试环境需要注入内存实现，依赖</text>
<text x="384" y="258" class="body">必须在构造时显式出现</text><text x="384" y="322" class="label">只做一步</text><text x="384" y="342" class="body action">依赖倒置（二）：依赖注入不是容</text>
<text x="384" y="370" class="body action">器魔法</text><path d="M 652 310 H 668" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="672" y="140" width="282" height="300" rx="24" class="card"/><text x="690" y="172" class="stage">需求 3 · P10</text><text x="690" y="210" class="label">暴露问题</text><text x="690" y="230" class="body">第二家支付实现对金额和失败条件</text>
<text x="690" y="258" class="body">有不同限制，需要共同的行为契约</text><text x="690" y="322" class="label">只做一步</text><text x="690" y="342" class="body action">里氏替换：子类型必须守住行为契</text>
<text x="690" y="370" class="body action">约</text><path d="M 958 310 H 974" class="arrow" marker-end="url(#arrow)"/></g><g><rect x="978" y="140" width="282" height="300" rx="24" class="card"/><text x="996" y="172" class="stage">需求 4 · P11</text><text x="996" y="210" class="label">暴露问题</text><text x="996" y="230" class="body">审计调用方只写事件，不应被迫依</text>
<text x="996" y="258" class="body">赖查询、删除等无关能力</text><text x="996" y="322" class="label">只做一步</text><text x="996" y="342" class="body action">接口隔离：让调用方只依赖自己需</text>
<text x="996" y="370" class="body action">要的能力</text></g>
  <text x="60" y="485" class="subtitle">直接实现 → 记录修改扩散 → 放置最小边界 → 用业务测试验证 → 继续接受下一轮需求</text></svg>