<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">建造者与对象不变量：让复杂对象只在完整时出现 UML</title><desc id="desc">Builder 暂存可变配置；只有 build() 校验完成后才创建不可变 Request。</desc><defs><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 Z" fill="#334155"/></marker></defs><style>.canvas{fill:#fffdf7}.title{font:700 30px system-ui;fill:#1e293b}.subtitle{font:17px system-ui;fill:#64748b}.uml-node{stroke:#1e293b;stroke-width:2.5;fill:#eff6ff}.node-1{fill:#f5f3ff}.node-2{fill:#ecfdf5}.node-3{fill:#fff7ed}.divider,.edge{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:9 7}.stereotype{font:italic 15px system-ui;fill:#64748b;text-anchor:middle}.class-name{font:700 21px system-ui;fill:#0f172a;text-anchor:middle}.member{font:16px ui-monospace,monospace;fill:#334155}.edge-label-bg{fill:#fffdf7}.edge-label{font:14px system-ui;fill:#475569;text-anchor:middle}</style><rect width="100%" height="100%" rx="28" class="canvas"/><text x="55" y="53" class="title">UML 建造者图 · 建造者与对象不变量</text><text x="55" y="84" class="subtitle">Builder 暂存可变配置；只有 build() 校验完成后才创建不可变 Request。</text><g><path d="M 225 270 V 295 H 660 V 320" class="edge" marker-end="url(#triangle)"/><rect x="368.5" y="268" width="148" height="24" rx="8" class="edge-label-bg"/><text x="442.5" y="285" class="edge-label">configures</text></g><g><path d="M 660 519 V 522 H 1095 V 525" class="edge dashed" marker-end="url(#triangle)"/><rect x="803.5" y="495" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="512" class="edge-label">validates</text></g><g><path d="M 660 320 V 317 H 1095 V 314" class="edge" marker-end="url(#triangle)"/><rect x="803.5" y="290" width="148" height="24" rx="8" class="edge-label-bg"/><text x="877.5" y="307" class="edge-label">creates valid</text></g><g id="client"><rect x="55" y="115" width="340" height="155" rx="18" class="uml-node node-0"/><text x="225" y="146" class="stereotype">«Caller»</text><text x="225" y="180" class="class-name">Client</text><path d="M 55 193 H 395" class="divider"/><text x="77" y="220" class="member">+ configure request</text></g><g id="builder"><rect x="490" y="320" width="340" height="199" rx="18" class="uml-node node-1"/><text x="660" y="351" class="stereotype">«Builder»</text><text x="660" y="385" class="class-name">RequestBuilder</text><path d="M 490 398 H 830" class="divider"/><text x="512" y="425" class="member">- method / url / timeout / body</text><text x="512" y="449" class="member">+ with_timeout()</text><text x="512" y="473" class="member">+ with_json()</text><text x="512" y="497" class="member">+ build(): Request</text></g><g id="request"><rect x="925" y="115" width="340" height="199" rx="18" class="uml-node node-2"/><text x="1095" y="146" class="stereotype">«Immutable Product»</text><text x="1095" y="180" class="class-name">Request</text><path d="M 925 193 H 1265" class="divider"/><text x="947" y="220" class="member">+ method: str</text><text x="947" y="244" class="member">+ url: str</text><text x="947" y="268" class="member">+ timeout: float</text><text x="947" y="292" class="member">+ body: bytes?</text></g><g id="guard"><rect x="925" y="525" width="340" height="155" rx="18" class="uml-node node-3"/><text x="1095" y="556" class="stereotype">«Build Boundary»</text><text x="1095" y="590" class="class-name">Invariant checks</text><path d="M 925 603 H 1265" class="divider"/><text x="947" y="630" class="member">GET cannot have body</text><text x="947" y="654" class="member">timeout &gt; 0</text></g><text x="55" y="752" class="subtitle">虚线：依赖 / 实现　◇：组合所有权　△：契约或继承方向</text></svg>