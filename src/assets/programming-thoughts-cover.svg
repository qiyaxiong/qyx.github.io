<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">编程思想与设计模式 46 讲</title>
  <desc id="desc">从变化、设计原则、设计模式到工程案例的课程封面</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071921"/>
      <stop offset="0.55" stop-color="#0b2830"/>
      <stop offset="1" stop-color="#102036"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#d9f7f2" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".28"/></filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <rect width="1200" height="630" rx="34" fill="url(#grid)"/>
  <circle cx="990" cy="150" r="310" fill="url(#glow)"/>

  <g transform="translate(70 70)">
    <rect width="168" height="38" rx="19" fill="#2dd4bf" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".55"/>
    <text x="84" y="25" fill="#99f6e4" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">46 PART SERIES</text>
    <text y="104" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="53" font-weight="800">编程思想与设计模式</text>
    <text y="158" fill="#d5e7e9" font-family="system-ui,sans-serif" font-size="24">先解释变化，再选择结构</text>
  </g>

  <g transform="translate(70 310)" filter="url(#shadow)" font-family="system-ui,sans-serif">
    <g>
      <rect width="210" height="130" rx="20" fill="#0f3540" stroke="#2d5963"/>
      <text x="24" y="42" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="2">01 · CHANGE</text>
      <text x="24" y="82" fill="#f8fafc" font-size="25" font-weight="700">识别变化轴</text>
      <text x="24" y="108" fill="#9fb7be" font-size="16">谁因为什么而修改？</text>
    </g>
    <path d="M224 65h48" stroke="#5eead4" stroke-width="3"/><path d="m265 56 12 9-12 9" fill="none" stroke="#5eead4" stroke-width="3"/>
    <g transform="translate(290)">
      <rect width="210" height="130" rx="20" fill="#0f3540" stroke="#2d5963"/>
      <text x="24" y="42" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="2">02 · PRINCIPLE</text>
      <text x="24" y="82" fill="#f8fafc" font-size="25" font-weight="700">划定稳定边界</text>
      <text x="24" y="108" fill="#9fb7be" font-size="16">职责、契约与依赖方向</text>
    </g>
    <path d="M514 65h48" stroke="#5eead4" stroke-width="3"/><path d="m555 56 12 9-12 9" fill="none" stroke="#5eead4" stroke-width="3"/>
    <g transform="translate(580)">
      <rect width="210" height="130" rx="20" fill="#0f3540" stroke="#2d5963"/>
      <text x="24" y="42" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="2">03 · PATTERN</text>
      <text x="24" y="82" fill="#f8fafc" font-size="25" font-weight="700">选择协作结构</text>
      <text x="24" y="108" fill="#9fb7be" font-size="16">理解收益，也承担代价</text>
    </g>
    <path d="M804 65h48" stroke="#5eead4" stroke-width="3"/><path d="m845 56 12 9-12 9" fill="none" stroke="#5eead4" stroke-width="3"/>
    <g transform="translate(870)">
      <rect width="210" height="130" rx="20" fill="#143348" stroke="#385975"/>
      <text x="24" y="42" fill="#93c5fd" font-size="15" font-weight="700" letter-spacing="2">04 · PRACTICE</text>
      <text x="24" y="82" fill="#f8fafc" font-size="25" font-weight="700">用测试验证</text>
      <text x="24" y="108" fill="#a9bfd4" font-size="16">46 个案例与迁移练习</text>
    </g>
  </g>

  <text x="70" y="555" fill="#94aeb5" font-family="system-ui,sans-serif" font-size="19">高内聚 · 低耦合 · 设计原则 · 创建型模式 · 结构型模式</text>
</svg>
